<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="wiring-overview"><style>
  @page { size: A4 landscape; margin: 10mm; }
  * { box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1c1c1e;
         font-size: 11pt; line-height: 1.4; margin: 0 auto; padding: 16px; max-width: 1400px; background: #fff; }
  h1 { font-size: 22pt; margin: 0 0 2pt; }
  h2 { font-size: 14pt; margin: 22pt 0 6pt; padding: 5pt 10pt; background: #1c1c1e; color: #fff; border-radius: 6px; }
  p { margin: 0 0 6pt; }
  .muted { color: #666; }
  
  svg text { font-family: Arial, Helvetica, sans-serif; }
  .w { fill: none; stroke-width: 3; stroke-linejoin: round; }
  .v12 { stroke: #d62d2d; } .gnd { stroke: #222; } .v33 { stroke: #e8842c; } .v5 { stroke: #8a4fd6; }
  .i2c { stroke: #2a7fd4; } .sig { stroke: #2fa84f; } .pul { stroke: #c2185b; } .led { stroke: #00897b; }
  .blk { fill: #fff; stroke-width: 2.5; }
  .t { font-size: 12px; } .b { font-weight: bold; } .s { font-size: 10px; fill: #555; } .xs { font-size: 9px; fill: #555; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-top: 8pt; }
  .card { border: 2px solid #E8845C; border-radius: 8px; padding: 8pt 11pt; background: #FFF7F3; page-break-inside: avoid; }
  .card.warn { border-color: #D14; background: #FFF0F0; }
  .card.ok { border-color: #34A853; background: #F1FAF2; }
  .card b.t { display: block; margin-bottom: 3pt; font-size: 11.5pt; }
  .card ul { margin: 0; padding-left: 16pt; } .card li { margin-bottom: 3pt; }
  code { font-family: "SF Mono", Menlo, monospace; font-size: 9.5pt; background: #f0efec; padding: 1pt 4pt; border-radius: 3px; }
  svg { page-break-inside: avoid; }
  .pb { page-break-before: always; }
</style><rect id="bg" width="100%" height="100%" fill="#fff"/>
  <defs>
    <g id="g"><path d="M0 0V8M-10 8H10M-6 12H6M-2 16H2" stroke="#222" stroke-width="2" fill="none"/></g>
  </defs>

  <!-- ============ SPINA CONN 17 ============ -->
  <text x="120" y="36" text-anchor="middle" class="t b">IDC16 plug → CBE DS-300 connector 17</text>
  <rect x="20" y="50" width="200" height="360" rx="8" fill="#f4f1ec" stroke="#1c1c1e" stroke-width="2.5"/>
  <g class="t">
    <rect x="100" y="87" width="120" height="26" fill="#fff" stroke="#888"/><text x="108" y="104">15 · +12 V (B2)</text>
    <rect x="100" y="137" width="120" height="26" fill="#fff" stroke="#888"/><text x="108" y="154">3 · GND</text>
    <rect x="100" y="187" width="120" height="26" fill="#fff" stroke="#888"/><text x="108" y="204">6 · PUMP</text>
    <rect x="100" y="237" width="120" height="26" fill="#fff" stroke="#888"/><text x="108" y="254">14 · MAIN 12 V</text>
    <rect x="100" y="297" width="120" height="26" fill="#fff" stroke="#888"/><text x="108" y="314">11 · AGND</text>
    <rect x="100" y="332" width="120" height="26" fill="#fff" stroke="#888"/><text x="108" y="349">9 · GREY FULL</text>
    <rect x="100" y="367" width="120" height="26" fill="#fff" stroke="#888"/><text x="108" y="384">13 · GREY 1/3</text>
  </g>
  <text x="30" y="80" class="s">always on</text>
  <text x="30" y="154" class="s b">ground</text>

  <!-- +12 V: fusibile → buck + JD-VCC -->
  <path class="w v12" d="M220 100H300"/>
  <rect x="300" y="92" width="40" height="16" fill="#fff" stroke="#d62d2d" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" class="s">2 A fuse</text>
  <path class="w v12" d="M340 100H500"/>
  <circle cx="690" cy="100" r="4.5" fill="#8a4fd6"/>
  <path class="w v5" d="M690 100V165H440V410H530V360"/>
  <text x="446" y="428" class="xs" style="fill:#8a4fd6">5 V coils (JD-VCC)</text>

  <!-- GND pin 3 -->
  <path class="w gnd" d="M220 150H260"/><use href="#g" x="260" y="150"/>

  <!-- C.POMPA -> relay 2 NC -->
  <path class="w led" d="M220 200H455V180H775V250H750"/>
  <text x="262" y="193" class="s">pin 6 to GND = pump ON</text>

  <!-- C.GEN -->
  <path class="w gnd" d="M220 250H500"/>
  <text x="262" y="243" class="s">pin 14 to GND = 12 V loads ON</text>

  <!-- BUCK -->
  <rect class="blk" x="500" y="70" width="170" height="80" rx="6" stroke="#8a4fd6"/>
  <text x="590" y="94" text-anchor="middle" class="t b">Buck 12→5 V</text>
  <text x="590" y="112" text-anchor="middle" class="s">USB-C output</text>
  <text x="508" y="104" class="s">IN+</text><text x="508" y="134" class="s">IN−</text>
  <path class="w gnd" d="M500 130H480"/><use href="#g" x="480" y="130"/>
  <path class="w v5" d="M670 100H1030"/>
  <text x="850" y="92" text-anchor="middle" class="s" style="fill:#8a4fd6">5 V USB-C → CN2 (≥ 3 A)</text>

  <!-- ============ RELE' ============ -->
  <rect class="blk" x="500" y="190" width="250" height="170" rx="8" stroke="#2fa84f"/>
  <text x="625" y="210" text-anchor="middle" class="t b">ARCELI 2-channel relay module · 5 V coils</text>
  <text x="510" y="237" class="t b">RELAY 1 · 12 V loads</text>
  <text x="740" y="237" text-anchor="end" class="t b">RELAY 2 · pump</text>
  <g class="s" text-anchor="end">
    <circle cx="750" cy="250" r="4"/><text x="740" y="254">NC</text>
    <circle cx="750" cy="285" r="4"/><text x="740" y="289">COM</text>
    <circle cx="750" cy="320" r="4" fill="#bbb"/><text x="740" y="324">NO · unused</text>
  </g>
  <path class="w gnd" d="M750 285H770"/><use href="#g" x="770" y="285"/>
  <g class="s">
    <circle cx="500" cy="250" r="4"/><text x="510" y="254">NC</text>
    <circle cx="500" cy="285" r="4"/><text x="510" y="289">COM</text>
    <circle cx="500" cy="320" r="4" fill="#bbb"/><text x="510" y="324">NO · unused</text>
  </g>
  <g class="xs">
    <text x="530" y="350" text-anchor="middle">JD-VCC</text><text x="580" y="350" text-anchor="middle">GND</text>
    <text x="630" y="350" text-anchor="middle">VCC</text><text x="680" y="350" text-anchor="middle">IN1</text>
    <text x="725" y="350" text-anchor="middle">IN2</text>
  </g>
  <path class="w gnd" d="M500 285H480"/><use href="#g" x="480" y="285"/>
  <use href="#g" x="580" y="360"/>
  <text x="625" y="223" text-anchor="middle" class="xs b" style="fill:#d62d2d">remove the VCC–JD-VCC jumper</text>
  <path class="w v33" d="M630 360V400H880"/>
  <text x="745" y="394" class="xs" style="fill:#e8842c">3V3 → relay VCC</text>
  <circle cx="880" cy="400" r="4.5" fill="#e8842c"/>

  <!-- PCF -> relay inputs -->
  <path class="w sig" d="M680 360V470"/>
  <text x="688" y="446" class="xs">P0→IN1</text>
  <path class="w pul" d="M725 360V470"/>
  <text x="733" y="430" class="xs">P1→IN2</text>

  <!-- ============ PCF8574 ============ -->
  <rect class="blk" x="620" y="470" width="240" height="130" rx="8" stroke="#2a7fd4"/>
  <g class="s"><text x="680" y="489" text-anchor="middle">P0</text><text x="725" y="489" text-anchor="middle">P1</text></g>
  <text x="740" y="535" text-anchor="middle" class="t b">PCF8574 · 0x20</text>
  <text x="740" y="553" text-anchor="middle" class="s">A0 · A1 · A2 → GND</text>
  <text x="740" y="571" text-anchor="middle" class="xs">P0 relay 1 · P1 relay 2 · P2–P7 free</text>
  <path class="w i2c" style="stroke-width:3" d="M860 540H880"/><circle cx="880" cy="540" r="4.5" fill="#2a7fd4"/>

  <!-- ============ ADS1115 ============ -->
  <rect class="blk" x="620" y="640" width="240" height="100" rx="8" stroke="#2a7fd4"/>
  <g class="s"><text x="628" y="668">GND</text><text x="628" y="688">A2</text><text x="628" y="708">A3</text></g>
  <text x="765" y="672" text-anchor="middle" class="t b">ADS1115 · 0x48</text>
  <text x="765" y="692" text-anchor="middle" class="s">ADDR → GND</text>
  <text x="765" y="712" text-anchor="middle" class="s">A0 · A1 = NTC probes</text>
  <path class="w i2c" style="stroke-width:3" d="M860 690H880"/><circle cx="880" cy="690" r="4.5" fill="#2a7fd4"/>

  <path class="w" style="stroke:#7a9a01" d="M220 310H410V664H620"/>
  <path class="w" style="stroke:#7b3fa0" d="M220 345H390V684H620"/>
  <path class="w" style="stroke:#8b6b3d" d="M220 380H370V704H620"/>
  <text x="430" y="659" class="xs">pin 11 AGND → ADS GND (own wire)</text>
  <text x="430" y="679" class="xs">pin 9 → A2 (+100 kΩ to 3V3)</text>
  <text x="430" y="699" class="xs">pin 13 → A3 (+100 kΩ to 3V3)</text>

  <!-- ============ BUS I2C ============ -->
  <path class="w i2c" style="stroke-width:6" d="M1030 190H880V690"/>
  <text transform="translate(896 615) rotate(-90)" text-anchor="middle" class="xs" style="fill:#2a7fd4">bus I²C · 3V3 GND SDA SCL</text>

  <!-- ============ PANNELLO P4 ============ -->
  <rect x="1030" y="40" width="350" height="190" rx="10" fill="#1c1c1e"/>
  <text x="1205" y="75" text-anchor="middle" fill="#fff" class="b" style="font-size:16px">P4 PANEL</text>
  <text x="1205" y="95" text-anchor="middle" style="font-size:11px;fill:#bbb">Guition JC8012P4A1C · ESP32-P4</text>
  <text x="1205" y="140" text-anchor="middle" style="font-size:12px;fill:#E8845C">WiFi ↔ Home Assistant</text>
  <text x="1205" y="158" text-anchor="middle" style="font-size:10px;fill:#999">firmware/panel-p4.yaml</text>
  <text x="1040" y="104" style="font-size:10px;fill:#fff">CN2 · 5 V</text>
  <text x="1040" y="194" style="font-size:10px;fill:#fff">CN4 · I²C</text>

  <!-- ============ LEGENDA ============ -->
  <g class="s">
    <text x="30" y="470" class="b" style="fill:#1c1c1e;font-size:12px">Legend</text>
    <path class="w v12" d="M30 490H70"/><text x="80" y="494">+12 V (B2, after the fuse) → buck only</text>
    <path class="w gnd" d="M30 510H70"/><text x="80" y="514">GND / signals pulled to ground</text>
    <path class="w v33" d="M30 530H70"/><text x="80" y="534">3V3 from CN4</text>
    <path class="w v5" d="M30 550H70"/><text x="80" y="554">5 V (P4 + relay coils)</text>
    <path class="w i2c" d="M30 570H70"/><text x="80" y="574">I²C bus (4 wires)</text>
    <path class="w sig" d="M30 590H70"/><text x="80" y="594">relay command (PCF → IN, low = energised)</text>
    <path class="w" style="stroke:#7a9a01" d="M30 610H44"/><path class="w" style="stroke:#7b3fa0" d="M44 610H57"/><path class="w" style="stroke:#8b6b3d" d="M57 610H70"/><text x="80" y="614">grey tank probes: AGND · full · 1/3</text>
  </g>
</svg>