<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1100" height="760" fill="#ffffff"/>
  <style>
    .w{fill:none;stroke-width:3;stroke-linejoin:round}
    .v12{stroke:#d62d2d}.gnd{stroke:#222}.v33{stroke:#e8842c}.v5{stroke:#8a4fd6}
    .scl{stroke:#2a7fd4}.sda{stroke:#2a7fd4;stroke-dasharray:7,4}.cmd{stroke:#e0a800}.sig{stroke:#10936d}
    .h{font-weight:bold;font-size:15px}
    .s{font-size:11px;fill:#555}
  </style>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Complete wiring (as built and tested)</text>

  <!-- ===== conn 17 plug ===== -->
  <rect x="20" y="60" width="200" height="640" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="120" y="86" text-anchor="middle" class="h" fill="#4c1d95">IDC16 plug</text>
  <text x="120" y="104" text-anchor="middle" class="s">into DS-300 connector 17</text>
  <circle cx="220" cy="140" r="6" fill="#8a6a40"/><text x="40" y="145">15 · B2 +12 V</text>
  <circle cx="220" cy="200" r="6" fill="#1e1e1e"/><text x="40" y="205">3 · GND</text>
  <circle cx="220" cy="480" r="6" fill="#d62d2d"/><text x="40" y="485">14 · C.GEN</text>
  <circle cx="220" cy="540" r="6" fill="#f57c00"/><text x="40" y="545">6 · C.POMPA</text>
  <circle cx="220" cy="620" r="6" fill="#7b3fa0"/><text x="40" y="625">9 · REC 3/3</text>
  <circle cx="220" cy="670" r="6" fill="#10936d"/><text x="40" y="675">11 · AGND</text>
  <text x="40" y="250" class="s">other pins: not connected</text>

  <!-- ===== power ===== -->
  <rect x="270" y="122" width="70" height="36" rx="5" fill="#fff" stroke="#d62d2d" stroke-width="2"/>
  <text x="305" y="145" text-anchor="middle">fuse 2 A</text>
  <rect x="380" y="100" width="170" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="465" y="124" text-anchor="middle" class="h">Buck 12 → 5 V</text>
  <text x="465" y="141" text-anchor="middle" class="s">8–32 V in · 5 V 3 A USB-C</text>
  <text x="392" y="171">IN+</text><text x="392" y="196">IN−</text>
  <text x="540" y="171" text-anchor="end">USB-C</text>
  <path class="w v12" d="M220,140 H270"/>
  <path class="w v12" d="M340,140 H360 V166 H380"/>
  <path class="w gnd" d="M220,200 H380"/>
  <path class="w v5" d="M550,166 H820"/>
  <text x="690" y="158" text-anchor="middle" class="s">USB-C cable to the panel (5 V ≥ 3 A)</text>
  <circle cx="720" cy="166" r="5" fill="#8a4fd6"/>

  <!-- ===== panel ===== -->
  <rect x="820" y="70" width="260" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="950" y="96" text-anchor="middle" class="h" fill="#78350f">Guition JC8012P4A1C</text>
  <text x="950" y="113" text-anchor="middle" class="s">ESP32-P4 panel · back side</text>
  <text x="836" y="171">USB-C (power)</text>
  <text x="1064" y="190" text-anchor="end">CN4 · JST SH 1.0</text>
  <text x="1064" y="206" text-anchor="end" class="s">GND · 3V3 · SCL · SDA (silkscreen)</text>

  <!-- ===== I2C bus ===== -->
  <path class="w v33" d="M960,220 V250 H330"/>
  <path class="w gnd" d="M975,220 V262 H350"/>
  <path class="w scl" d="M990,220 V274 H370"/>
  <path class="w sda" d="M1005,220 V286 H390"/>
  <text x="320" y="240" class="s">I²C bus, in parallel to all modules: 3V3 · GND · SCL · SDA</text>

  <!-- ===== PCF8574 ===== -->
  <rect x="300" y="320" width="200" height="110" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <path class="w v33" d="M330,250 V320"/><circle cx="330" cy="250" r="4" fill="#e8842c"/>
  <path class="w gnd" d="M350,262 V320"/><circle cx="350" cy="262" r="4" fill="#222"/>
  <path class="w scl" d="M370,274 V320"/><circle cx="370" cy="274" r="4" fill="#2a7fd4"/>
  <path class="w sda" d="M390,286 V320"/><circle cx="390" cy="286" r="4" fill="#2a7fd4"/>
  <text x="400" y="348" text-anchor="middle" class="h" fill="#4c1d95">PCF8574 · 0x20</text>
  <text x="400" y="365" text-anchor="middle" class="s">A0 A1 A2 → GND</text>
  <text x="488" y="390" text-anchor="end">P0</text>
  <text x="488" y="410" text-anchor="end">P1</text>
  <path class="w cmd" d="M500,386 H560"/>
  <path class="w cmd" d="M500,406 H560"/>

  <!-- ===== relay module ===== -->
  <rect x="560" y="320" width="220" height="130" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <path class="w v33" d="M600,250 V320"/><circle cx="600" cy="250" r="4" fill="#e8842c"/>
  <path class="w gnd" d="M620,262 V320"/><circle cx="620" cy="262" r="4" fill="#222"/>
  <path class="w v5" d="M720,166 V320"/>
  <text x="596" y="336" class="s">VCC</text><text x="622" y="336" class="s">GND</text><text x="724" y="336" class="s">JD-VCC</text>
  <text x="670" y="358" text-anchor="middle" class="h" fill="#065f46">2-ch relay, 5 V coils</text>
  <text x="670" y="374" text-anchor="middle" class="s" fill="#b91c1c">remove the VCC–JD-VCC jumper</text>
  <text x="570" y="390">IN1</text><text x="570" y="410">IN2</text>
  <text x="600" y="444" class="s">NC1</text><text x="636" y="444" class="s">COM1</text>
  <text x="690" y="444" class="s">NC2</text><text x="726" y="444" class="s">COM2</text>

  <!-- relay contacts to the plug -->
  <path class="w cmd" d="M610,450 V480 H220"/>
  <path class="w cmd" d="M700,450 V540 H220"/>
  <path class="w gnd" d="M650,450 V580 H250 V200"/>
  <path class="w gnd" d="M740,450 V580 H650"/>
  <circle cx="250" cy="200" r="5" fill="#222"/><circle cx="650" cy="580" r="5" fill="#222"/>
  <text x="420" y="472" class="s">relay 1 NC → C.GEN (12 V loads)</text>
  <text x="420" y="532" class="s">relay 2 NC → C.POMPA (water pump)</text>
  <text x="420" y="572" class="s">both COM → GND (pin 3) · NO unused</text>

  <!-- ===== ADS1115 ===== -->
  <rect x="820" y="320" width="260" height="190" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <path class="w v33" d="M850,250 V320"/><circle cx="850" cy="250" r="4" fill="#e8842c"/>
  <path class="w gnd" d="M870,262 V320"/><circle cx="870" cy="262" r="4" fill="#222"/>
  <path class="w scl" d="M890,274 V320"/><circle cx="890" cy="274" r="4" fill="#2a7fd4"/>
  <path class="w sda" d="M910,286 V320"/><circle cx="910" cy="286" r="4" fill="#2a7fd4"/>
  <text x="950" y="348" text-anchor="middle" class="h" fill="#1e3a8a">ADS1115 · 0x48</text>
  <text x="950" y="365" text-anchor="middle" class="s">ADDR → GND (floating = random address)</text>
  <text x="834" y="392">A0 · CBE NTC inside</text>
  <text x="834" y="408" class="s">3V3 → 10 kΩ 1% → A0 → NTC → GND</text>
  <text x="834" y="432">A1 · CBE NTC outside</text>
  <text x="834" y="448" class="s">same divider on A1 (2-wire NTCs, no polarity)</text>
  <text x="834" y="472">A2 · grey tank full</text>
  <text x="834" y="488" class="s">3V3 → 100 kΩ → A2 → pin 9</text>
  <path class="w sig" d="M220,620 H900 V510"/>
  <path class="w sig" d="M220,670 H1040 V510" stroke-dasharray="8,4"/>
  <text x="900" y="612" text-anchor="end" class="s">pin 9 → A2</text>
  <text x="1036" y="662" text-anchor="end" class="s">pin 11 AGND → ADS1115 GND, with its own wire</text>

  <text x="40" y="735" fill="#555" font-size="12">Relays at rest (panel off, rebooting, dead) = NC closed = loads and pump ON. The PCF8574 pulls IN low to energise a relay = OFF.</text>
</svg>
