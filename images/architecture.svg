<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">CBE DS-300 → ESP32-P4 panel → Home Assistant</text>

  <!-- DS-300 -->
  <rect x="20" y="60" width="200" height="300" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="120" y="84" text-anchor="middle" font-weight="bold" fill="#222">CBE DS-300</text>
  <text x="120" y="102" text-anchor="middle" fill="#555" font-size="12">distribution unit (stays)</text>
  <rect x="40" y="120" width="160" height="96" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="120" y="142" text-anchor="middle" fill="#7f1d1d">main 12 V relay</text>
  <text x="120" y="160" text-anchor="middle" fill="#7f1d1d" font-size="12">pin 14 C.GEN to GND = ON</text>
  <text x="120" y="184" text-anchor="middle" fill="#7f1d1d">pump relay</text>
  <text x="120" y="202" text-anchor="middle" fill="#7f1d1d" font-size="12">pin 6 C.POMPA to GND = ON</text>
  <rect x="40" y="228" width="160" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="120" y="250" text-anchor="middle" fill="#1e3a8a">grey tank "full" probe</text>
  <text x="120" y="268" text-anchor="middle" fill="#1e3a8a" font-size="12">pin 9 + pin 11 AGND</text>
  <text x="120" y="310" text-anchor="middle" fill="#555" font-size="12">pin 15 B2 +12 V · pin 3 GND</text>
  <text x="120" y="330" text-anchor="middle" fill="#555" font-size="12">16-pin connector 17</text>

  <!-- plug -->
  <rect x="250" y="150" width="110" height="110" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="305" y="178" text-anchor="middle" font-weight="bold" fill="#4c1d95">IDC16</text>
  <text x="305" y="196" text-anchor="middle" fill="#4c1d95" font-size="12">3D-printed</text>
  <text x="305" y="212" text-anchor="middle" fill="#4c1d95" font-size="12">plug, replaces</text>
  <text x="305" y="228" text-anchor="middle" fill="#4c1d95" font-size="12">the CBE panel</text>

  <!-- interface -->
  <rect x="390" y="60" width="230" height="300" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="505" y="84" text-anchor="middle" font-weight="bold" fill="#065f46">Interface (modules)</text>
  <text x="505" y="114" text-anchor="middle" fill="#065f46">2-ch relay module, 5 V coils</text>
  <text x="505" y="132" text-anchor="middle" fill="#065f46" font-size="12">relay 1 = 12 V loads · relay 2 = pump</text>
  <text x="505" y="150" text-anchor="middle" fill="#065f46" font-size="12">both on NC: at rest = everything ON</text>
  <text x="505" y="186" text-anchor="middle" fill="#065f46">PCF8574 (I²C 0x20)</text>
  <text x="505" y="204" text-anchor="middle" fill="#065f46" font-size="12">P0 → IN1 · P1 → IN2</text>
  <text x="505" y="240" text-anchor="middle" fill="#065f46">ADS1115 (I²C 0x48)</text>
  <text x="505" y="258" text-anchor="middle" fill="#065f46" font-size="12">A0/A1 CBE NTC probes · A2 grey tank</text>
  <text x="505" y="294" text-anchor="middle" fill="#065f46">12 → 5 V buck, 3 A</text>
  <text x="505" y="312" text-anchor="middle" fill="#065f46" font-size="12">2 A fuse on B2</text>

  <!-- panel -->
  <rect x="650" y="100" width="150" height="220" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="725" y="128" text-anchor="middle" font-weight="bold" fill="#78350f">Guition</text>
  <text x="725" y="146" text-anchor="middle" font-weight="bold" fill="#78350f">JC8012P4A1C</text>
  <text x="725" y="170" text-anchor="middle" fill="#78350f" font-size="12">ESP32-P4 + C6 WiFi</text>
  <text x="725" y="188" text-anchor="middle" fill="#78350f" font-size="12">10.1" 1280×800 touch</text>
  <text x="725" y="212" text-anchor="middle" fill="#78350f" font-size="12">ESPHome + LVGL</text>
  <text x="725" y="236" text-anchor="middle" fill="#78350f" font-size="12">I²C on CN4</text>
  <text x="725" y="254" text-anchor="middle" fill="#78350f" font-size="12">PIN to switch 12 V</text>

  <!-- HA -->
  <rect x="830" y="100" width="110" height="220" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="885" y="128" text-anchor="middle" font-weight="bold" fill="#0c4a6e">Home</text>
  <text x="885" y="146" text-anchor="middle" font-weight="bold" fill="#0c4a6e">Assistant</text>
  <text x="885" y="174" text-anchor="middle" fill="#0c4a6e" font-size="12">lights, battery,</text>
  <text x="885" y="190" text-anchor="middle" fill="#0c4a6e" font-size="12">water, gas,</text>
  <text x="885" y="206" text-anchor="middle" fill="#0c4a6e" font-size="12">engine (WiCAN),</text>
  <text x="885" y="222" text-anchor="middle" fill="#0c4a6e" font-size="12">tyres (TPMS),</text>
  <text x="885" y="238" text-anchor="middle" fill="#0c4a6e" font-size="12">climate, media</text>

  <line x1="220" y1="205" x2="248" y2="205" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="205" x2="388" y2="205" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="205" x2="648" y2="205" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="634" y="196" text-anchor="middle" fill="#555" font-size="11">I²C</text>
  <line x1="800" y1="200" x2="828" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="828" y1="220" x2="802" y2="220" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="815" y="250" text-anchor="middle" fill="#555" font-size="11">API</text>

  <text x="480" y="395" text-anchor="middle" fill="#555" font-size="12">Panel dead, rebooting or unplugged → relays at rest → 12 V loads and pump stay ON (fail-safe).</text>
</svg>
