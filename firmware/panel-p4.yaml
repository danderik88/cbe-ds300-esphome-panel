# Prince floor plan (docs/ui-v2/prince-top.png) rotated with the nose to the right and
# already composited on the card colour: one per theme, no runtime filters.
image:
  - file: images/plan_dark.png
    id: img_plan_dark
    type: RGB565
  - file: images/plan_light.png
    id: img_plan_light
    type: RGB565
  - file: images/roof_top_h.png
    id: img_roof
    type: RGB565
    transparency: alpha_channel

touchscreen:
  - platform: gsl3680
    id: touch
    i2c_id: bus_i2c
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    # The GSL3680 sometimes does not raise the touch-release interrupt: without this
    # fallback the touch stays "pressed" and the next tap is swallowed
    # (double tap after a swipe). Forced re-read after 50ms of silence.
    touch_timeout: 50ms
    # Transform for landscape with lvgl rotation: 90 (from espcontrol, same board)
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    # Touch-to-wake (replaces the touch_any binary_sensor of the 7")
    on_release:
      then:
        - if:
            condition:
              lvgl.is_paused
            then:
              # Turns on at the current brightness (the global may have been
              # changed by the HA automation while the screen was off)
              - light.turn_on:
                  id: display_backlight
                  brightness: !lambda 'return id(display_brightness) / 100.0;'
              - lvgl.resume:
              - lvgl.widget.redraw:
              # Turned off from the clock screen: go back to House
              - if:
                  condition:
                    lambda: 'return id(night_on);'
                  then:
                    - script.execute: night_exit

# ────────────────────────────────────────────────────────────
# ESP32 diagnostics
# ────────────────────────────────────────────────────────────
button:
  - platform: restart
    name: "Riavvia"
    icon: "mdi:restart"

  - platform: safe_mode
    name: "Safe Mode"
    icon: "mdi:shield-bug"

  # Below 10V the DS-300 cuts the loads and only re-arms with OFF->ON
  # of the main switch (CBE manual p. 6).
  - platform: template
    name: "Reset utenze 12V"
    icon: "mdi:restart-alert"
    on_press:
      - switch.turn_off: sw_utenze
      - delay: 3s
      - switch.turn_on: sw_utenze

# ────────────────────────────────────────────────────────────
# Album cover (Media page): HA exposes the media player cover as
# entity_picture (token proxy, no login). The panel downloads it
# from HA on every change and shows it instead of the music note.
# ────────────────────────────────────────────────────────────
http_request:
  timeout: 10s

online_image:
  - id: cover_img
    url: "${ha_url}/local/cover.jpg"  # replaced by set_url, never downloaded on its own
    # Covers from the Apple TV (HomePod) integration arrive as JPEG
    format: JPEG
    type: RGB565
    resize: 400x400
    buffer_size: 32768
    on_download_finished:
      - lvgl.image.update: { id: md_cover, src: cover_img }
      - lvgl.widget.show: md_cover
    on_error:
      - lvgl.widget.hide: md_cover


# ────────────────────────────────────────────────────────────
# ESP32 diagnostics
# ────────────────────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    name: "WiFi Segnale"
    update_interval: 30s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: internal_temperature
    name: "Temperatura CPU"
    entity_category: diagnostic
    update_interval: 60s

  # ────────────────────────────────────────────────────────────
  # CBE temperature probes (2-wire NTC) on ADS1115
  # Divider: 3V3 -> fixed R 10k 1% -> ADS channel -> NTC -> GND
  # A0 = INDOOR probe, A1 = OUTDOOR probe
  # ────────────────────────────────────────────────────────────
  - platform: ads1115
    ads1115_id: adc_ntc
    id: ntc_int_v
    multiplexer: A0_GND
    gain: 4.096
    update_interval: 10s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 3

  - platform: resistance
    id: ntc_int_r
    sensor: ntc_int_v
    configuration: DOWNSTREAM
    resistor: ${ntc_r_fixed}
    reference_voltage: 3.3V
    internal: true

  - platform: ntc
    id: temp_int_ntc
    sensor: ntc_int_r
    name: "Temp interna (sonda CBE)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: ${ntc_beta}
      reference_temperature: 25°C
      reference_resistance: ${ntc_r25}
    filters:
      # Probe disconnected / shorted -> absurd value: don't show it
      - filter_out: nan
      - lambda: 'return (x > -40.0f && x < 90.0f) ? x : NAN;'
    on_value:
      - lambda: 'id(ntc_int_seen) = millis();'
      - script.execute: update_temps

  # Grey tank full probe: 3V3 -> 100k -> A2 -> electrode; common = pin 11 (AGND).
  # Dry ~3.3 V, wet below ~1.6 V. The tank only has the full-level pair
  # (blue/brown screws at the top, validated with a jumper 2026-10-13); REC 1/3 (A3)
  # follows the full probe upstream in the DS-300, so it is not read.
  - platform: ads1115
    ads1115_id: adc_ntc
    id: grey_full_v
    name: "Grigie pieno (tensione sonda)"
    multiplexer: A2_GND
    gain: 4.096
    update_interval: 10s
    accuracy_decimals: 2

  - platform: ads1115
    ads1115_id: adc_ntc
    id: ntc_ext_v
    multiplexer: A1_GND
    gain: 4.096
    update_interval: 10s
    internal: true
    filters:
      - median:
          window_size: 5
          send_every: 3

  - platform: resistance
    id: ntc_ext_r
    sensor: ntc_ext_v
    configuration: DOWNSTREAM
    resistor: ${ntc_r_fixed}
    reference_voltage: 3.3V
    internal: true

  - platform: ntc
    id: temp_ext_ntc
    sensor: ntc_ext_r
    name: "Temp esterna (sonda CBE)"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: ${ntc_beta}
      reference_temperature: 25°C
      reference_resistance: ${ntc_r25}
    filters:
      - filter_out: nan
      - lambda: 'return (x > -40.0f && x < 90.0f) ? x : NAN;'
    on_value:
      - lambda: 'id(ntc_ext_seen) = millis();'
      - script.execute: update_temps

  # ─── Energy (Victron SmartShunt) ───
  - platform: homeassistant
    id: ha_batt_soc
    entity_id: sensor.victron_smart_shunt_battery
    on_value:
      - script.execute: update_resources
  - platform: homeassistant
    id: ha_current
    entity_id: sensor.victron_smart_shunt_current
    on_value:
      - script.execute: update_resources
  - platform: homeassistant
    id: ha_batt_v2
    entity_id: sensor.victron_smart_shunt_voltage
    on_value:
      - lvgl.label.update:
          id: rs_batt_u
          text: !lambda 'return ui::fmt(x, 1, " V");'
  - platform: homeassistant
    id: ha_batt_v1
    entity_id: sensor.victron_smart_shunt_starter_battery_voltage
    on_value:
      - lvgl.label.update:
          id: vs_v1
          text: !lambda 'return ui::fmt(x, 1, " V");'
  - platform: homeassistant
    id: ha_batt_power
    entity_id: sensor.victron_smart_shunt_power
    on_value:
      - lvgl.label.update:
          id: rc_pow
          text: !lambda 'return ui::fmt(x, 0, " W");'

  # ─── 230V mains from the hookup post (Sonoff MINI-ZB1GP; unavailable = post unplugged) ───
  - platform: homeassistant
    id: ha_rete_w
    entity_id: sensor.rete_230v_power
    on_value: { script.execute: update_rete }
  - platform: homeassistant
    id: ha_rete_a
    entity_id: sensor.rete_230v_current
    on_value: { script.execute: update_rete }
  - platform: homeassistant
    id: ha_rete_lim
    entity_id: input_number.limite_colonnina
    on_value: { script.execute: update_rete }

  # ─── Water and gas ───
  - platform: homeassistant
    id: ha_water
    entity_id: sensor.esp32_serbatoio_acqua_livello_acqua
    on_value:
      - script.execute: update_resources
      # Greys: count only fresh water drops; hysteresis against level noise
      # (noise counted only on the way down would make the estimate creep up by itself).
      - lambda: |-
          float &ref = id(fresh_ref);
          if (isnan(x)) return;
          if (isnan(ref) || x > ref + 3.0f) { ref = x; return; }  // start or refill
          if (x < ref - 1.0f) {
            id(grey_est_l) = std::min(id(grey_est_l) + (ref - x) / 100.0f * ${water_l} * ${grey_from_fresh}f, (float) ${grey_l});
            ref = x;
            id(update_grey).execute();
          }
