globals:
  # Seconds until the loads are cut during spegni_server (countdown)
  - id: ut_left
    type: int
    initial_value: '0'
  # Estimated greys: fresh litres used x${grey_from_fresh} since the last emptying
  - id: grey_est_l
    type: float
    restore_value: yes
    initial_value: '0'
  - id: fresh_ref
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: dark_mode
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: display_brightness
    type: int
    restore_value: yes
    initial_value: '100'
  # Current setpoints (mirrored from HA, for the -/+ buttons)
  - id: clima_target
    type: float
    restore_value: no
    initial_value: '25.0'
  - id: frigo_target
    type: float
    restore_value: no
    initial_value: '4.0'
  # Domotic fridge (not smart): on if the inside drops below 10°,
  # off after 30 consecutive min above
  - id: dom_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: dom_warm_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Rest start (millis): within 10 s a touch returns to the previous page
  - id: night_t
    type: uint32_t
    initial_value: '0'
  # Active page: 0 House, 1 Resources, 2 Climate, 3 Vehicle, 4 Media, 5 System
  - id: cur_page
    type: int
    restore_value: no
    initial_value: '0'
  # Night screen active: no automatic backlight off
  - id: night_on
    type: bool
    restore_value: no
    initial_value: 'false'
  # millis() of the last valid reading of the local NTCs (0 = never read)
  - id: ntc_int_seen
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ntc_ext_seen
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Loads PIN keypad
  - id: pin_buf
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: pin_target
    type: bool
    restore_value: no
    initial_value: 'false'
  # Alarm banner: current text and already-seen text ("Ok, visto")
  - id: alarm_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alarm_seen
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: alarm_idx
    type: int
    restore_value: no
    initial_value: '0'
  # Hourly resource history (72 h, % 0-100, 255 = no data).
  # Saved in flash: written once an hour, estimates survive reboots.
  - id: hist_batt
    type: std::array<uint8_t, 72>
    restore_value: yes
  - id: hist_water
    type: std::array<uint8_t, 72>
    restore_value: yes
  - id: hist_gas
    type: std::array<uint8_t, 72>
    restore_value: yes
  # Album cover: current URL (entity_picture) and last downloaded
  - id: cover_url
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: cover_loaded
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: hist_head
    type: int
    restore_value: yes
    initial_value: '0'
  # Hour (epoch/3600) of the last sample; 0 = history never initialized
  - id: hist_hour
    type: uint32_t
    restore_value: yes
    initial_value: '0'

# Dark mode exposed to HA: toggled by the camper_monitor_dark_mode automation (lux)
switch:
  - platform: template
    id: sw_dark_mode
    name: "Dark Mode"
    icon: "mdi:theme-light-dark"
    lambda: 'return id(dark_mode);'
    turn_on_action:
      - globals.set: { id: dark_mode, value: 'true' }
      - script.execute: apply_theme
    turn_off_action:
      - globals.set: { id: dark_mode, value: 'false' }
      - script.execute: apply_theme

  # ────────────────────────────────────────────────────────────
  # Main loads switch — CBE conn 17, pin 14 (C.GEN), level-driven
  # (verified 2026-08-13: pin 14 to GND = loads on).
  # PCF8574 P0 -> IN1 of the relay module (low level trigger). On 2026-10-13 the
  # relay did not click because of a broken white Dupont, not the pin. Relay 1: COM -> pin 3,
  # NC -> pin 14. P0 high = relay at rest = NC closed = loads ON, so
  # no inversion. Panel off/faulty = loads on.
  # The HAOS Raspberry and the GL.iNet are on the loads line too: switch off
  # only through the spegni_server script.
  - platform: gpio
    id: sw_utenze
    name: "Utenze 12V"
    icon: "mdi:power"
    pin:
      pcf8574: exp_out
      number: 0
      mode:
        output: true
    # The camper must come back ON after a panel reboot
    restore_mode: RESTORE_DEFAULT_ON

  # Water pump — PCF8574 P1 -> IN2, relay 2: COM -> conn17 pin 3 (GND),
  # NC -> pin 6 (C.POMPA), instead of the fixed jumper. P1 high = NC closed =
  # pump powered. For maintenance or leaks in the tank bay. The tank ESP
  # is on the same line: with the pump off, it goes offline too.
  - platform: gpio
    id: sw_pompa
    name: "Pompa acqua"
    icon: "mdi:water-pump"
    pin:
      pcf8574: exp_out
      number: 1
      mode:
        output: true
    # On every boot the pump comes back powered
    restore_mode: ALWAYS_ON


number:
  - platform: template
    id: num_brightness
    name: "Luminosita Display"
    icon: "mdi:brightness-6"
    min_value: 30
    max_value: 100
    step: 5
    lambda: 'return id(display_brightness);'
    update_interval: 5s
    set_action:
      - globals.set:
          id: display_brightness
          value: !lambda 'return (int)x;'
      - script.execute: update_brightness


# ────────────────────────────────────────────────────────────
# LVGL — UI v2 (docs/ui-v2)
# Screen coordinates 1280x800: navigation bar 0-104, content
# x 124-1260, top bar y 16-80, content y 96-784.
# Colours: ALL in the styles below (dark theme values); apply_theme
# rewrites them for the light theme. Widgets set no inline theme colours,
# only semantic ones (green/amber/red/blue/orange), same in both themes.
# ────────────────────────────────────────────────────────────
lvgl:
  id: lvgl_comp
  displays: [lcd]
  touchscreens: [touch]
  # Native 800x1280 portrait panel -> 1280x800 landscape UI
  rotation: 90
  byte_order: little_endian
  buffer_size: 25%
  log_level: WARN
  text_font: f_m17

  style_definitions:
    - { id: st_page, bg_color: 0x0E1116, bg_opa: COVER, text_color: 0xF2F2F4 }
    - { id: st_card, bg_color: 0x171B22, bg_opa: COVER, radius: 24, border_width: 0, pad_all: 0, shadow_width: 0 }
    - { id: st_tile, bg_color: 0x20252E, bg_opa: COVER, radius: 16, border_width: 0, pad_all: 0, shadow_width: 0, text_color: 0xF2F2F4 }
    - { id: st_light, bg_color: 0x20252E, bg_opa: COVER, border_width: 2, border_color: 0x262C36, pad_all: 0, shadow_width: 0, text_color: 0x8A909A }
    - { id: st_cold, bg_color: 0x16283A, bg_opa: COVER, border_color: 0x5AA9E6, text_color: 0x9FD0F5, shadow_color: 0x5AA9E6, shadow_width: 26, shadow_opa: 45%, shadow_spread: 1 }
    - { id: st_on, bg_color: 0x3A2A1E, bg_opa: COVER, border_color: 0xF5B461, text_color: 0xFFD9B0, shadow_color: 0xF5B461, shadow_width: 26, shadow_opa: 45%, shadow_spread: 1 }
    - { id: st_txt, text_color: 0xF2F2F4 }
    - { id: st_mut, text_color: 0x8A909A }
    - { id: st_dim, text_color: 0x5A606A }
    - { id: st_sep, bg_color: 0x262C36, bg_opa: COVER, radius: 0, border_width: 0, pad_all: 0 }
    - { id: st_track, bg_color: 0x20252E, bg_opa: COVER }
    - { id: st_arctrack, arc_color: 0x20252E, arc_width: 24, bg_opa: TRANSP, border_width: 0, pad_all: 0 }
    - { id: st_ring, bg_opa: TRANSP, border_width: 2, border_color: 0x262C36, pad_all: 0 }
    - { id: st_rail, bg_opa: TRANSP, radius: 20, border_width: 0, shadow_width: 0, pad_all: 0, text_color: 0x8A909A }
    - { id: st_railon, bg_color: 0x20252E, bg_opa: COVER, text_color: 0xE8845C }
    - { id: st_railbox, bg_opa: TRANSP, radius: 0, pad_all: 0, border_width: 1, border_side: RIGHT, border_color: 0x262C36 }
    - { id: st_banner, bg_color: 0x5A1612, bg_opa: COVER, radius: 18, border_width: 0, pad_all: 0, text_color: 0xFFD4CF }
    - { id: st_bannerbtn, bg_color: 0x7A231D, bg_opa: COVER, radius: 12, border_width: 0, shadow_width: 0, text_color: 0xFFD4CF }
    - { id: st_overlay, bg_color: 0x171B22, bg_opa: COVER, radius: 24, border_width: 3, border_color: 0xE8845C, pad_all: 0 }
    - { id: st_ghost, bg_opa: TRANSP, border_width: 0, shadow_width: 0, pad_all: 0 }
    - { id: st_modeon, bg_color: 0xE8845C, bg_opa: COVER, text_color: 0xFFFFFF }
    - { id: st_trans, bg_opa: TRANSP, border_width: 0, pad_all: 0, radius: 0 }
    # Rest screen: dark amber at night, light by day (night_enter)
    - { id: st_saver, text_color: 0x7A3A22 }
    - { id: st_saver2, text_color: 0x7A3A22 }

  # Rest: after 30 s without touches the screen with time, date,
  # temperatures and status appears (amber on black in dark theme, light in light theme).
  # A touch goes back to House.
  on_idle:
    timeout: 30s
    then:
      - if:
          condition:
            lambda: 'return !id(night_on);'
          then:
            - script.execute: { id: night_enter, night: !lambda 'return id(dark_mode);' }

  # ═══════════════ TOP LAYER: side bar, top bar, panels ═══════════════
  top_layer:
    widgets:
      # ── Navigation bar ──
      - obj:
          id: rail
          x: 0
          y: 0
          width: 104
          height: 800
          styles: st_railbox
          scrollable: false
          clickable: false
          hidden: true
          widgets:
            - label: { align: TOP_MID, y: 26, text: "\U000F11D4", text_font: i_l, text_color: 0xE8845C }
            - button:
                <<: &railbtn { x: 12, width: 80, height: 84, styles: st_rail, checked: { styles: st_railon } }
                id: rb_0
                y: 92
                widgets:
                  - label: { align: TOP_MID, y: 12, text: "\U000F02DE", text_font: i_m }
                  - label: { align: BOTTOM_MID, y: -12, text: "Casa", text_font: f_s14 }
                on_click: { script.execute: { id: nav, idx: 0 } }
            - button:
                <<: *railbtn
                id: rb_1
                y: 184
                widgets:
                  - label: { align: TOP_MID, y: 12, text: "\U000F051F", text_font: i_m }
                  - label: { align: BOTTOM_MID, y: -12, text: "Risorse", text_font: f_s14 }
                on_click: { script.execute: { id: nav, idx: 1 } }
            - button:
                <<: *railbtn
                id: rb_2
                y: 276
                widgets:
                  - label: { align: TOP_MID, y: 12, text: "\U000F0393", text_font: i_m }
                  - label: { align: BOTTOM_MID, y: -12, text: "Clima", text_font: f_s14 }
                on_click: { script.execute: { id: nav, idx: 2 } }
            - button:
                <<: *railbtn
                id: rb_3
                y: 368
                widgets:
                  - label: { align: TOP_MID, y: 12, text: "\U000F07FB", text_font: i_m }
                  - label: { align: BOTTOM_MID, y: -12, text: "Veicolo", text_font: f_s14 }
                on_click: { script.execute: { id: nav, idx: 3 } }
            - button:
                <<: *railbtn
                id: rb_4
                y: 460
                widgets:
                  - label: { align: TOP_MID, y: 12, text: "\U000F075A", text_font: i_m }
                  - label: { align: BOTTOM_MID, y: -12, text: "Media", text_font: f_s14 }
                on_click: { script.execute: { id: nav, idx: 4 } }
            - button:
                <<: *railbtn
                id: rb_5
                y: 552
                widgets:
                  - label: { align: TOP_MID, y: 12, text: "\U000F08BB", text_font: i_m }
                  - label: { align: BOTTOM_MID, y: -12, text: "Sistema", text_font: f_s14 }
                on_click: { script.execute: { id: nav, idx: 5 } }

      # ── Top bar: time, date, living area status / alarm banner ──
      - obj:
          id: topbar
          x: 124
          y: 16
          width: 1136
          height: 64
          styles: st_trans
          scrollable: false
          clickable: false
          hidden: true
          widgets:
            - label: { id: hdr_clock, x: 0, y: 4, text: "--:--", text_font: f_b48, styles: st_txt }
            - label: { id: hdr_dow, x: 150, y: 8, text: "", text_font: f_b20, styles: st_txt }
            - label: { id: hdr_date, x: 150, y: 36, text: "", text_font: f_s15, styles: st_mut }
            - obj:
                id: chip_porta
                <<: &chip { y: 8, height: 48, styles: st_card, scrollable: false, clickable: false }
                x: 508
                width: 150
                widgets:
                  - label: { id: chip_porta_i, x: 16, y: 11, text: "\U000F10AF", text_font: i_s, text_color: 0x8A909A }
                  - label: { x: 48, y: 13, text: "Porta", styles: st_mut }
            - obj:
                id: chip_gas
                <<: *chip
                x: 672
                width: 110
                widgets:
                  - label: { id: chip_gas_i, x: 16, y: 11, text: "\U000F0647", text_font: i_s, text_color: 0x8A909A }
                  - label: { x: 48, y: 13, text: "Gas", styles: st_mut }
            - obj:
                id: chip_stato
                <<: *chip
                clickable: true
                x: 796
                width: 200
                on_click:
                  - lvgl.widget.update: { id: alarm_panel, hidden: false }
                widgets:
                  - label: { id: chip_stato_i, x: 16, y: 11, text: "\U000F0CC8", text_font: i_s, text_color: 0x34C759 }
                  - label: { id: chip_stato_l, x: 48, y: 13, text: "Nessun allarme", styles: st_mut }
            - obj:
                id: banner
                x: 280
                y: 4
                width: 716
                height: 56
                styles: st_banner
                scrollable: false
                hidden: true
                widgets:
                  - label: { x: 16, y: 15, text: "\U000F0026", text_font: i_s, text_color: 0xFF5A4E }
                  - label: { id: banner_l, x: 52, y: 17, width: 506, text: "", long_mode: DOT }
                  - button:
                      x: 570
                      y: 8
                      width: 136
                      height: 40
                      styles: st_bannerbtn
                      widgets:
                        - label: { align: CENTER, text: "Ok, visto", text_font: f_s15 }
                      on_click:
                        - lambda: 'if (!id(alarm_text).empty()) id(alarm_seen) += (id(alarm_seen).empty() ? "|" : "") + id(alarm_text) + "|";'
                        - script.execute: update_alarms
            - button:
                x: 1010
                y: 4
                width: 56
                height: 56
                radius: 28
                styles: [st_card, st_mut]
                widgets:
                  - label: { align: CENTER, text: "\U000F0594", text_font: i_m }
                on_click: { script.execute: { id: night_enter, night: true } }
            - button:
                x: 1080
                y: 4
                width: 56
                height: 56
                radius: 28
                styles: [st_card, st_mut]
                widgets:
                  - label: { align: CENTER, text: "\U000F00DF", text_font: i_m }
                on_click: { script.execute: toggle_brightness_panel }

      # ── Brightness panel (opens from the icon, hides after 5 s) ──
      - obj:
