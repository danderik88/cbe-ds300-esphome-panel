                on_click: { homeassistant.service: { service: input_number.set_value, data: { entity_id: input_number.limite_colonnina, value: "16" } } }
            - button:
                x: 28
                y: 254
                width: 544
                height: 52
                styles: st_tile
                widgets:
                  - label: { align: CENTER, text: "Chiudi", text_font: f_b20 }
                on_click:
                  - lvgl.widget.update: { id: lim_panel, hidden: true }

      # ── "Partenza" (departure) checklist ──
      - obj:
          id: check_panel
          x: 340
          y: 92
          width: 600
          height: 620
          styles: st_overlay
          scrollable: false
