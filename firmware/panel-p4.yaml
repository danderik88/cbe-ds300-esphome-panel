            - button: { <<: *pinkey, x: 38, y: 272, widgets: [label: { align: CENTER, text: "4", text_font: f_b36 }], on_click: { script.execute: { id: pin_key, d: "4" } } }
            - button: { <<: *pinkey, x: 190, y: 272, widgets: [label: { align: CENTER, text: "5", text_font: f_b36 }], on_click: { script.execute: { id: pin_key, d: "5" } } }
