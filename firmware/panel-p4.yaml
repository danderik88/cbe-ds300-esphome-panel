            - label: { x: 28, y: 330, id: chk_4_i, text: "\U000F05E0", text_font: i_s }
            - label: { x: 64, y: 332, id: chk_4_l, text: "Condizionatore spento", styles: st_txt }
            - label: { x: 28, y: 390, id: chk_5_i, text: "\U000F05E0", text_font: i_s }
            - label: { x: 64, y: 392, id: chk_5_l, text: "Nessuna fuga di gas", styles: st_txt }
            - label: { x: 28, y: 450, id: chk_6_i, text: "\U000F05E0", text_font: i_s }
            - label: { x: 64, y: 452, id: chk_6_l, text: "Frigo acceso", styles: st_txt }
            - label: { x: 28, y: 506, width: 544, text: "Oblò, gradino e rubinetto del gas: controllali a vista.", text_font: f_s14, styles: st_mut, long_mode: WRAP }
            - button:
                x: 28
                y: 548
                width: 544
                height: 52
                styles: st_tile
                widgets:
                  - label: { align: CENTER, text: "Chiudi", text_font: f_b20 }
                on_click:
                  - lvgl.widget.update: { id: check_panel, hidden: true }

      # ── 12V loads: cut-off countdown + notice when the loads are off ──
      # With the loads off a transparent veil covers the pages (not the side
      # bar): any touch, e.g. on a light, reopens the notice.
