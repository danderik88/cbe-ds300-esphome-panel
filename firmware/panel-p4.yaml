                styles: st_overlay
                scrollable: false
                widgets:
                  - label: { id: utp_icon, align: TOP_MID, y: 24, text: "\U000F0425", text_font: i_l, text_color: 0xFF5A4E }
                  - label: { id: utp_title, align: TOP_MID, y: 82, text: "Utenze 12V spente", text_font: f_b36, styles: st_txt }
