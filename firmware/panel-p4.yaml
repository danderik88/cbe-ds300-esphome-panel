      - obj:
          id: ut_catch
          x: 104
          y: 0
          width: 1176
          height: 800
          styles: st_trans
          scrollable: false
          hidden: true
          on_click:
            - lvgl.widget.update: { id: ut_pop, hidden: false }
      - obj:
          id: ut_pop
          x: 0
          y: 0
          width: 1280
