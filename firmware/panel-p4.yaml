## Dashboard camper — Guition JC8012P4A1C (ESP32-P4 + C6, 10.1" 800x1280 MIPI DSI)
##
## UI v2 (docs/ui-v2): camper panel. Fixed navigation bar
## (House, Resources, Climate, Vehicle, Media, System), true Prince layout with
## the 15 lights, autonomy estimates calculated on the panel, vehicle in
## second floor (alarms appear as banners on every page).
## Light/dark theme: switch "Dark Mode" (HA camper_monitor_dark_mode automation).
## WiFi via ESP32-C6 (esp-hosted), HA API. Audio removed (no speakers).
## Flash: see README.md.

substitutions:
  device_name: monitor-camper-p4
  device_friendly: "Monitor Camper"

  # ─── General utilities switch (conn 17 CBE pin 14 = C.GEN) ───
  # PIN required on screen before switching 12V loads.
  utenze_pin: !secret loads_pin

  # ─── CBE NTC probes on ADS1115 ───
  # Measured in camper 2026-09-28: int 12.45k @18.5 C, ext 13.58k @16.5 C.
  # Beta 3950 + R25 9.2k make both within 0.2 C. Beta not verified
  # away from 17 C: a point in water and ice (0 C) confirms it.
  ntc_beta: "3950"
  ntc_r25: "9.2kOhm"
  ntc_r_fixed: "10kOhm"

  # ─── Autonomy estimates ───
  # Ability to convert percentages: 2x100 Ah AGM, 118 L tank.
  batt_ah: "200"
  water_l: "118"
  # Greys: undocumented capacity, ~210 L by eye (2026-10-13). ponytail:
  # the full probe realigns the estimate; correct if the data is discovered.
  grey_l: "210"
  grey_from_fresh: "0.9"
  # Threshold at which battery is considered "empty" (AGM: below 40% triggers
  # critical alert in HA). Water and gas count down to 0.
  batt_floor: "40"

  # Camper Home Assistant (media player album cover)
  ha_url: !secret ha_url

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}
  min_version: 2026.1.0
  includes:
    - ui_helpers.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # -100 = after setup complete: at 600 (like on the 7") the P4 crashes at boot
    # because LVGL is not yet initialized when lvgl.page.show starts
    priority: -100
    then:
      - light.turn_on: display_backlight
      - script.execute: apply_theme
      - delay: 1600ms
      - script.execute: { id: nav, idx: 0 }
      - script.execute: update_brightness
      - script.execute: update_utenze
      - script.execute: update_resources
      - script.execute: update_grey
      - script.execute: update_chart


esp32:
  variant: ESP32P4
  flash_size: 16MB
  # NB: 360MHz crashes boot on this chip (rev1.3 + engineering_sample) — see test 2026-07-04
  cpu_frequency: 400MHZ
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# WiFi via ESP32-C6 coprocessor (SDIO)
esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: 20MHz
  # use_psram REMOVED 2026-07-05: build without it stable on bench (6+ min);
  # the reference config (jtenniswood) doesn't use it. The sdio_mempool_create assert
  # on 4/7 it was a symptom of C6 not power-cycled, not the RAM.

psram:
  mode: hex
  speed: 200MHz

# MIPI DSI PHY power supply
esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: true

# gsl3680 vendorized (kvj/esphome@jd9365_gsl3680 + mark_failed patch for 2026.x)
external_components:
  - source:
      type: local
      path: components
    components: [gsl3680]

logger:
  level: INFO
  # The panel's USB-C uses a UART0 bridge, not USB_SERIAL_JTAG
  hardware_uart: UART0

# Print reset reason + heap on every boot — silent crash diagnostics
debug:
  update_interval: 30s

# ────────────────────────────────────────────────────────────
# Network + Home Assistant
# ────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "${device_name}"
    password: !secret wifi_ap_password

api:
  encryption:
    key: !secret api_key
  # Standalone: never restart if HA is absent (panel useful even without network)
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time

# ────────────────────────────────────────────────────────────
# Hardware: I2C, backlight PWM, display MIPI DSI, touch
# ────────────────────────────────────────────────────────────
i2c:
  - id: bus_i2c
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: false
    sda_pullup_enabled: false
    scl_pullup_enabled: false

# External ADC for the two CBE NTC probes: no ADC free on P4
# free (GPIO16-23 and 49-54 are occupied or not wired on the board).
# Breakout on CN4 or FPC3, ADDR to GND -> 0x48. A2/A3 remain free.
ads1115:
  - id: adc_ntc
    i2c_id: bus_i2c
    address: 0x48
    continuous_mode: false

# I2C expander on the same CN4: controls the relay module (hardware/interface-board-bom.md).
# P0 = 1st general utilities relay. Webasto moved to dedicated ESP32 (status via HA).
# At startup outputs are high = relay at rest.
pcf8574:
  - id: exp_out
    i2c_id: bus_i2c
    address: 0x20
    pcf8575: false

# Real PWM backlight (on the 7" it was on/off + software overlay)
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO23

light:
  - platform: monochromatic
    output: backlight_pwm
    id: display_backlight
    name: "Retroilluminazione"
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0
# Symmetric wake: anything that turns on the backlight (HA, number
# brightness must also resume LVGL, otherwise screen freezes
    on_turn_on:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

display:
  - platform: mipi_dsi
    id: lcd
    model: JC8012P4A1
    color_order: RGB
    reset_pin: GPIO27
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 1280


