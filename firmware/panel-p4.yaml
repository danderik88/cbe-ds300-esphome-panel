# Script
# ────────────────────────────────────────────────────────────
script:
  - id: update_grey
    then:
      - lambda: |-
          int pct = (int) lroundf(id(grey_est_l) * 100.0f / ${grey_l});
          bool full = id(grey_full).state;
          uint32_t c = full ? ui::RED : (pct >= 75 ? ui::AMBER : 0xA08868);
          std::string v = std::to_string(pct) + "%";
          ui::text(id(hm_gri_v), v.c_str());
          ui::text(id(rs_gri_v), v.c_str());
          lv_bar_set_value(id(hm_gri_bar), pct, LV_ANIM_OFF);
          lv_bar_set_value(id(rs_gri_bar), pct, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(hm_gri_bar), lv_color_hex(c), LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(rs_gri_bar), lv_color_hex(c), LV_PART_INDICATOR);
          ui::text(id(hm_gri_d), full ? "piene" : "stima");
          ui::text(id(rs_gri_k1), full ? "Piene" : "Non piene");
          ui::text(id(rs_gri_u), (std::to_string((int) id(grey_est_l)) + " L").c_str());
  # Theme: rewrites the shared styles and forces a full redraw.
  - id: apply_theme
    then:
      - lambda: |-
          bool d = id(dark_mode);
          auto C = [d](uint32_t dk, uint32_t lt) { return lv_color_hex(d ? dk : lt); };
          lv_style_set_bg_color(id(st_page), C(0x0E1116, 0xE6E8EC));
          lv_style_set_text_color(id(st_page), C(0xF2F2F4, 0x1C1C1E));
          lv_style_set_bg_color(id(st_card), C(0x171B22, 0xFFFFFF));
          lv_style_set_bg_color(id(st_tile), C(0x20252E, 0xF0F2F5));
          lv_style_set_text_color(id(st_tile), C(0xF2F2F4, 0x1C1C1E));
          lv_style_set_bg_color(id(st_light), C(0x20252E, 0xFFFFFF));
          lv_style_set_border_color(id(st_light), C(0x262C36, 0xDADDE3));
          lv_style_set_text_color(id(st_light), C(0x8A909A, 0x636366));
          lv_style_set_bg_color(id(st_on), C(0x3A2A1E, 0xFFE9D2));
          lv_style_set_text_color(id(st_on), C(0xFFD9B0, 0x8A4A12));
          lv_style_set_bg_color(id(st_cold), C(0x16283A, 0xDCEBF8));
          lv_style_set_text_color(id(st_cold), C(0x9FD0F5, 0x1F5F94));
          lv_style_set_text_color(id(st_txt), C(0xF2F2F4, 0x1C1C1E));
          lv_style_set_text_color(id(st_mut), C(0x8A909A, 0x636366));
          lv_style_set_text_color(id(st_dim), C(0x5A606A, 0xA0A4AB));
          lv_style_set_bg_color(id(st_sep), C(0x262C36, 0xDADDE3));
          lv_style_set_bg_color(id(st_track), C(0x20252E, 0xE4E7EC));
          lv_style_set_arc_color(id(st_arctrack), C(0x20252E, 0xE4E7EC));
          lv_style_set_border_color(id(st_ring), C(0x262C36, 0xD0D4DA));
          lv_style_set_text_color(id(st_rail), C(0x8A909A, 0x636366));
          lv_style_set_bg_color(id(st_railon), C(0x20252E, 0xFFFFFF));
          lv_style_set_border_color(id(st_railbox), C(0x262C36, 0xDADDE3));
          lv_style_set_bg_color(id(st_banner), C(0x5A1612, 0xFFE1DD));
          lv_style_set_text_color(id(st_banner), C(0xFFD4CF, 0x8A1C12));
          lv_style_set_bg_color(id(st_bannerbtn), C(0x7A231D, 0xFFC9C2));
          lv_style_set_text_color(id(st_bannerbtn), C(0xFFD4CF, 0x8A1C12));
          lv_style_set_bg_color(id(st_overlay), C(0x171B22, 0xFFFFFF));
          lv_obj_report_style_change(nullptr);
          ui::checked(id(sw_dark), d);
      - if:
          condition:
            lambda: 'return id(dark_mode);'
          then:
            - lvgl.image.update: { id: plan_img, src: img_plan_dark }
          else:
            - lvgl.image.update: { id: plan_img, src: img_plan_light }

  # Navigation: page idx (0 House ... 5 System) + side bar state
  - id: nav
    parameters:
      idx: int
    then:
      - lambda: |-
          esphome::lvgl::LvPageType *pg[] = {id(page_home), id(page_risorse), id(page_clima),
                                             id(page_veicolo), id(page_media), id(page_sistema)};
          if (idx < 0 || idx > 5) idx = 0;
          id(cur_page) = idx;
          id(lvgl_comp)->show_page(pg[idx]->index, LV_SCREEN_LOAD_ANIM_NONE, 0);
          lv_obj_t *rb[] = {id(rb_0), id(rb_1), id(rb_2), id(rb_3), id(rb_4), id(rb_5)};
          for (int i = 0; i < 6; i++) ui::checked(rb[i], i == idx);
          ui::hidden(id(rail), false);
          ui::hidden(id(topbar), false);
      - script.execute: load_cover

  # Cover: downloaded only while the Media page is open. Decoding the JPEG
  # (up to 400 KB, at full resolution) blocks the loop for a few seconds:
  # better while looking at the player than on the other pages.
  - id: load_cover
    then:
      - if:
          condition:
            lambda: 'return id(cover_url).empty();'
          then:
            - lambda: 'id(cover_loaded) = "";'
            - lvgl.widget.hide: md_cover
          else:
            - if:
                condition:
                  lambda: 'return id(cur_page) == 4 && id(cover_url) != id(cover_loaded);'
                then:
                  - lambda: 'id(cover_loaded) = id(cover_url);'
                  - online_image.set_url:
                      id: cover_img
                      url: !lambda 'return std::string("${ha_url}") + id(cover_url);'

  # ── Night screen ──
  - id: update_nt_track
    then:
      - lambda: |-
          auto &t = id(ha_media_title).state, &a = id(ha_media_artist).state;
          bool on = id(ha_media_state).state == "playing" && !t.empty();
          ui::hidden(id(nt_music), !on);
          if (on) ui::text(id(nt_track), a.empty() ? t : t + " · " + a);

  # night = true: dark amber and minimum brightness (Night scene, moon, evening);
  # false: light text at normal brightness (daytime rest).
  - id: night_enter
    parameters:
      night: bool
    then:
      - lambda: |-
          id(night_on) = true;
          id(night_t) = millis();
          // in the evening everything is amber dark; during the day grayish light, the rest thinner
          lv_style_set_text_color(id(st_saver), lv_color_hex(night ? 0x7A3A22 : 0xA8ADB4));
          lv_style_set_text_color(id(st_saver2), lv_color_hex(night ? 0x7A3A22 : 0x7A8089));
          lv_obj_report_style_change(nullptr);
          ui::hidden(id(rail), true);
          ui::hidden(id(topbar), true);
          ui::hidden(id(brightness_panel), true);
          ui::hidden(id(check_panel), true);
          ui::hidden(id(alarm_panel), true);
          ui::hidden(id(lim_panel), true);
      - lvgl.page.show: page_notte
      - script.execute: update_clock
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return night ? 0.07f : id(display_brightness) / 100.0f;'
      - script.execute: saver_timeout

  # After 30 s of clock screen with nobody in the dinette the screen turns off (a touch turns it back on)
  - id: saver_timeout
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            # with someone in the dinette it stays on; restarts when they leave
            lambda: 'return id(night_on) && !id(ha_presence).state;'
          then:
            - light.turn_off: { id: display_backlight, transition_length: 2s }
            - delay: 2s
            - lvgl.pause:

  # Dinette presence (Aqara mmWave): screen off -> clock screen, fading in
  - id: presence_wake
    then:
      - if:
          condition:
            lambda: 'return id(night_on) && !id(display_backlight).current_values.is_on();'
          then:
            - script.stop: saver_timeout
            - lvgl.resume:
            - lvgl.widget.redraw:
            - script.execute: update_clock
            - light.turn_on:
                id: display_backlight
                transition_length: 2s
                brightness: !lambda 'return id(dark_mode) ? 0.07f : id(display_brightness) / 100.0f;'

  - id: night_exit
    then:
      - script.stop: saver_timeout
      - lambda: 'id(night_on) = false;'
      - light.turn_on:
          id: display_backlight
          brightness: !lambda 'return id(display_brightness) / 100.0;'
      # short rest (distraction): back to the previous page, otherwise House
      - script.execute:
          id: nav
          idx: !lambda 'return millis() - id(night_t) < 10000 ? id(cur_page) : 0;'

  # ── Clock (top bar and Night screen) ──
  - id: update_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          static const char *giorni[] = {"Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"};
          static const char *mesi[] = {"gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio",
                                       "agosto", "settembre", "ottobre", "novembre", "dicembre"};
          char hm[8]; snprintf(hm, sizeof hm, "%02d:%02d", now.hour, now.minute);
          std::string dm = std::to_string(now.day_of_month) + " " + mesi[now.month - 1];
          ui::text(id(hdr_clock), hm);
          ui::text(id(hdr_dow), giorni[now.day_of_week - 1]);
          ui::text(id(hdr_date), dm);
          if (id(night_on)) {
            ui::text(id(nt_clock), hm);
            ui::text(id(nt_date), std::string(giorni[now.day_of_week - 1]) + " " + dm);
          }

  # ── Lights: count of lights on ──
  - id: update_lights
    then:
      - lambda: |-
          int n = 0;
          for (auto *s : {id(ha_l_princ), id(ha_l_tavolo), id(ha_l_panca), id(ha_l_leddin), id(ha_l_corr),
                          id(ha_l_cucina), id(ha_l_ledcuc), id(ha_l_bagno), id(ha_l_doccia), id(ha_l_gavone),
                          id(ha_l_esterna), id(ha_l_mans1), id(ha_l_mans2), id(ha_l_letto1), id(ha_l_letto2)})
            if (s->state == "on") n++;
          ui::text(id(lights_count), n == 0 ? std::string("Luci tutte spente")
                                     : (n == 1 ? std::string("1 luce accesa su 15")
                                               : std::to_string(n) + " luci accese su 15"));
          ui::color(id(lights_count), n ? ui::ACCENT : ui::GREY);
      - script.execute: update_checklist

  # ── Temperatures and weather ──
  - id: update_temps
    then:
      - lambda: |-
          bool ni = id(ntc_int_seen) && millis() - id(ntc_int_seen) < 120000;
          bool ne = id(ntc_ext_seen) && millis() - id(ntc_ext_seen) < 120000;
          float tin = ni ? id(temp_int_ntc).state : id(ha_t_din).state;
          float tout = ne ? id(temp_ext_ntc).state : id(ha_temp_ext).state;
          if (isnan(tout)) tout = id(ha_weather_temp).state;
          const std::string &w = id(ha_weather_state).state;
          const char *ico = "\U000F0595", *cond = "";
          if (w == "sunny") { ico = "\U000F0599"; cond = "sereno"; }
          else if (w == "clear-night") { ico = "\U000F0594"; cond = "sereno"; }
          else if (w == "partlycloudy") { ico = "\U000F0595"; cond = "poco nuvoloso"; }
          else if (w == "cloudy") { ico = "\U000F0590"; cond = "nuvoloso"; }
          else if (w == "rainy") { ico = "\U000F0597"; cond = "pioggia"; }
          else if (w == "pouring") { ico = "\U000F0596"; cond = "pioggia forte"; }
          else if (w == "snowy" || w == "snowy-rainy") { ico = "\U000F0598"; cond = "neve"; }
          else if (w == "fog") { ico = "\U000F0591"; cond = "nebbia"; }
          else if (w == "windy" || w == "windy-variant") { ico = "\U000F059D"; cond = "vento"; }
          else if (w == "lightning" || w == "lightning-rainy") { ico = "\U000F0593"; cond = "temporale"; }
          ui::text(id(dentro_v), ui::fmt(tin, 1, "°"));
          ui::text(id(meteo_ico), ico);
          ui::text(id(fuori_v), ui::fmt(tout, 1, "° fuori") + (*cond ? std::string(" · ") + cond : std::string()));
          ui::text(id(h_t_din), ui::fmt(id(ha_t_din).state, 1, "°"));
          ui::text(id(h_t_mans), ui::fmt(id(ha_t_mans).state, 1, "°"));
          ui::text(id(h_t_letto), ui::fmt(id(ha_t_letto).state, 1, "°"));
          ui::text(id(am_din), ui::fmt(id(ha_t_din).state, 1, "°"));
          ui::text(id(am_mans), ui::fmt(id(ha_t_mans).state, 1, "°"));
          ui::text(id(am_letto), ui::fmt(id(ha_t_letto).state, 1, "°"));
          ui::text(id(am_ext), ui::fmt(tout, 1, "°"));
          ui::text(id(nt_tin), ui::fmt(tin, 1, "°"));
          ui::text(id(nt_text), ui::fmt(tout, 1, "°"));

  # ── Resources: values, autonomy estimates, headline phrase ──
  - id: update_resources
    then:
      - lambda: |-
          const int H = id(hist_head);
          float soc = id(ha_batt_soc).state, wat = id(ha_water).state, gas = id(ha_gas_percent).state;
          float cur = id(ha_current).state, kg = id(ha_gas_kg).state;
          bool charging = !isnan(cur) && cur > 0.3f;
          float rb = ui::rate_per_hour(id(hist_batt), H, soc);
          float rw = ui::rate_per_hour(id(hist_water), H, wat);
          float rg = ui::rate_per_hour(id(hist_gas), H, gas);
          float hb = charging ? NAN : ui::hours_left(id(hist_batt), H, soc, ${batt_floor});
          float hw = ui::hours_left(id(hist_water), H, wat, 0);
          float hg = ui::hours_left(id(hist_gas), H, gas, 0);
          auto bar = [](lv_obj_t *b, float v) { lv_bar_set_value(b, isnan(v) ? 0 : (int) lroundf(v), LV_ANIM_OFF); };
          std::string sb = charging ? std::string("in carica") : ui::short_left(hb);
          // House
          ui::text(id(hm_batt_v), ui::fmt(soc, 0, "%")); bar(id(hm_batt_bar), soc); ui::text(id(hm_batt_d), sb);
          ui::text(id(hm_acq_v), ui::fmt(wat, 0, "%"));  bar(id(hm_acq_bar), wat);  ui::text(id(hm_acq_d), ui::short_left(hw));
          ui::text(id(hm_gas_v), ui::fmt(gas, 0, "%"));  bar(id(hm_gas_bar), gas);  ui::text(id(hm_gas_d), ui::short_left(hg));
          // Resources
          ui::text(id(rs_batt_v), ui::fmt(soc, 0, "%")); bar(id(rs_batt_bar), soc);
          ui::text(id(rs_batt_k1), sb);
          ui::text(id(rs_batt_k2), ui::fmt(cur, 1, " A"));
          ui::color(id(rs_batt_k2), isnan(cur) ? ui::GREY : (cur >= 0 ? ui::GREEN : ui::AMBER));
          ui::text(id(rs_batt_k3), isnan(rb) ? std::string("--") : ui::fmt(rb > 0 ? -rb * 24 * ${batt_ah} / 100.0f : 0.0f, 0, " Ah"));
          ui::text(id(rs_acq_v), ui::fmt(wat, 0, "%")); bar(id(rs_acq_bar), wat);
          ui::text(id(rs_acq_u), ui::fmt(wat * ${water_l} / 100.0f, 0, " L"));
          ui::text(id(rs_acq_k1), ui::short_left(hw));
          ui::text(id(rs_acq_k3), isnan(rw) ? std::string("--") : ui::fmt(rw > 0 ? -rw * 24 * ${water_l} / 100.0f : 0.0f, 0, " L"));
          ui::text(id(rs_gas_v), ui::fmt(gas, 0, "%")); bar(id(rs_gas_bar), gas);
          ui::text(id(rs_gas_k1), ui::short_left(hg));
          float kg_pct = (!isnan(kg) && gas > 1) ? kg / gas : NAN;
          ui::text(id(rs_gas_k3), (isnan(rg) || isnan(kg_pct)) ? std::string("--") : ui::fmt(rg > 0 ? -rg * 24 * kg_pct : 0.0f, 1, " kg"));
          ui::text(id(nt_batt), ui::fmt(soc, 0, "%"));
          // Phrase: the resource that runs out first (rounded estimates on purpose)
          struct R { float h; const char *n; } r[] = {{hb, "la batteria"}, {hw, "l'acqua"}, {hg, "il gas"}};
          std::sort(std::begin(r), std::end(r), [](const R &a, const R &b) {
            if (isnan(a.h)) return false;
            if (isnan(b.h)) return true;
            return a.h < b.h;
          });
          std::string head, para, home;
          if (isnan(r[0].h)) {
            head = "stima non disponibile";
            para = "Servono almeno 6 ore di dati dall'accensione del pannello o dall'ultimo rifornimento.";
            home = "stima in arrivo";
          } else if (std::isinf(r[0].h)) {
            head = ui::long_left(r[0].h);
            para = "Nessun consumo rilevante nelle ultime ore.";
            home = "> 7 giorni";
          } else {
            head = ui::long_left(r[0].h);
            para = std::string("Finisce prima ") + r[0].n + ".";
            if (!isnan(r[1].h) && !std::isinf(r[1].h))
              para += std::string(" Poi ") + r[1].n + " (" + ui::short_left(r[1].h) + ").";
            home = ui::short_left(r[0].h) + " · finisce prima " + r[0].n;
          }
          if (charging) para += " La batteria ora è in carica.";
          ui::text(id(rs_head), head);
          ui::text(id(rs_para), para);
          ui::text(id(hm_head), home);
      - script.execute: update_alarms

  # Hourly history sample (called every minute, writes once an hour)
  - id: history_tick
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          uint32_t hr = now.timestamp / 3600;
          float soc = id(ha_batt_soc).state, wat = id(ha_water).state, gas = id(ha_gas_percent).state;
          int H = id(hist_head);
          if (id(hist_hour) == 0) {
            id(hist_batt).fill(ui::NODATA); id(hist_water).fill(ui::NODATA); id(hist_gas).fill(ui::NODATA);
            H = 0;
          } else {
            if (hr <= id(hist_hour)) return;
            // hours without a sample (panel off): gaps in the history
            for (uint32_t k = 1; k < hr - id(hist_hour) && k < (uint32_t) ui::HN; k++) {
              ui::push(id(hist_batt), H, NAN); ui::push(id(hist_water), H, NAN); ui::push(id(hist_gas), H, NAN);
              H = (H + 1) % ui::HN;
            }
          }
          ui::push(id(hist_batt), H, soc); ui::push(id(hist_water), H, wat); ui::push(id(hist_gas), H, gas);
          id(hist_head) = (H + 1) % ui::HN;
          id(hist_hour) = hr;
      - script.execute: update_chart
      - script.execute: update_resources

  # 3-day chart: 72 samples, newest on the right
  - id: update_chart
    then:
      - lambda: |-
          const int H = id(hist_head);
          auto build = [H](const ui::Hist &h, esphome::lvgl::LvLineType *line) {
            int n = 0;
            for (int i = 0; i < ui::HN; i++) if (ui::at(h, H, i) != ui::NODATA) n++;
            esphome::FixedVector<lv_point_precise_t> pts;
            if (n < 2) {
              pts.init(2);
              pts.push_back({0, 159});
              pts.push_back({1, 159});
            } else {
              pts.init(n);
              for (int i = ui::HN - 1; i >= 0; i--) {
                uint8_t v = ui::at(h, H, i);
                if (v == ui::NODATA) continue;
                lv_point_precise_t p;
                p.x = (ui::HN - 1 - i) * 699 / (ui::HN - 1);
                p.y = 159 - v * 158 / 100;
                pts.push_back(p);
              }
            }
            line->set_points(std::move(pts));
          };
          build(id(hist_batt), id(ch_batt));
          build(id(hist_water), id(ch_acq));
          build(id(hist_gas), id(ch_gas));

  # ── Fridge and air conditioner ──
  - id: update_clima
    then:
      - lambda: |-
          const std::string &fs = id(ha_frigo_state).state;
          bool fknown = !fs.empty() && fs != "unavailable" && fs != "unknown";
          bool fon = fknown && fs != "off";
          float ft = id(ha_frigo_target).state, fn = id(ha_frigo_temp).state;
          const std::string &pr = id(ha_frigo_preset).state;
          ui::text(id(fr_state), !fknown ? std::string("non raggiungibile") : (fon ? std::string("acceso") : std::string("spento")));
          ui::color(id(fr_state), fon ? ui::GREEN : ui::GREY);
          ui::text(id(fr_set), ui::fmt(ft, 0, "°"));
          if (!isnan(ft)) lv_arc_set_value(id(fr_arc), (int) lroundf(ft));
          ui::text(id(fr_now), "ora " + ui::fmt(fn, 1, "°"));
          ui::checked(id(fr_eco), pr == "eco");
          ui::checked(id(fr_boost), pr == "boost");
          ui::text(id(fr_onoff_l), fon ? "Spegni" : "Accendi");
          ui::checked(id(fr_vevor), fon);
          ui::text(id(st_frigo_v), !fknown ? std::string("--") : (!fon ? std::string("spento")
                    : ui::fmt(fn, 1, "°") + (pr == "eco" ? " eco" : (pr == "boost" ? " boost" : ""))));

          const std::string &cs = id(ha_clima_state).state;
          bool cool = cs == "cool";
          bool man = !cool && id(ha_clima_sw).state == "on";
          bool avail = id(ha_clima_ok).state == "on";
          float ct = id(ha_clima_target).state, cn = id(ha_clima_now).state;
          ui::text(id(ac_avail), avail ? "230V ok" : "230V assente");
          ui::color(id(ac_avail), avail ? ui::GREEN : ui::GREY);
          ui::text(id(ac_mode_l), cool ? "Raffresca a" : (man ? "Manuale · termostato a" : "Spento · impostato"));
          ui::text(id(ac_set), ui::fmt(ct, 0, "°"));
          if (!isnan(ct)) lv_arc_set_value(id(ac_arc), (int) lroundf(ct));
          lv_obj_set_style_arc_color(id(ac_arc), lv_color_hex(cool || man ? ui::ACCENT : 0x5A606A), LV_PART_INDICATOR);
          ui::text(id(ac_now), "ora " + ui::fmt(cn, 1, "°"));
          ui::checked(id(ac_cool), cool);
          ui::checked(id(ac_man), man);
          ui::checked(id(ac_off), !cool && !man);
          ui::text(id(st_clima_v), !avail ? std::string("serve 230V") : (cool ? "raffresca " + ui::fmt(ct, 0, "°") : (man ? std::string("manuale") : std::string("spento"))));
          ui::color(id(st_clima_i), cool || man ? ui::ACCENT : ui::GREY);
      - script.execute: update_checklist

  # ── Door and gas: chip, floor plan, resources ──
  - id: update_security
    then:
      - lambda: |-
          const std::string &p = id(ha_porta).state;
          bool pk = p == "on" || p == "off", open = p == "on";
          uint32_t pc = !pk ? ui::GREY : (open ? ui::RED : ui::GREEN);
          const char *pico = open ? "\U000F081C" : "\U000F10AF";
          ui::text(id(chip_porta_i), pico); ui::color(id(chip_porta_i), pc);
          ui::text(id(h_porta_i), pico);    ui::color(id(h_porta_i), pc);
          ui::text(id(h_porta_v), !pk ? "--" : (open ? "APERTA" : "chiusa"));
          ui::color(id(h_porta_v), pc);
          lv_obj_set_style_bg_color(id(door_mark), lv_color_hex(pk ? pc : 0x5A606A), 0);
          const std::string &g = id(ha_gas_alarm).state;
          bool gk = g == "on" || g == "off", gal = g == "on";
          ui::color(id(chip_gas_i), !gk ? ui::GREY : (gal ? ui::RED : ui::GREEN));
          ui::text(id(rs_gas_k2), !gk ? "--" : (gal ? "ALLARME" : "no"));
          ui::color(id(rs_gas_k2), !gk ? ui::GREY : (gal ? ui::RED : ui::GREEN));
      - script.execute: update_alarms
      - script.execute: update_checklist

  # ── Alarm banner: one at a time, by severity ──
  - id: update_rete
    then:
      - lambda: |-
          float w = id(ha_rete_w).state, a = id(ha_rete_a).state;
          float lim = isnan(id(ha_rete_lim).state) ? 10.0f : id(ha_rete_lim).state;
          bool mt = id(ha_rete_mt).state == "on", live = !isnan(a);
          bool hot = live && a > 0.9f * lim;
          uint32_t c = mt ? ui::RED : (!live ? 0x5A606A : (hot ? ui::AMBER : ui::GREEN));
          ui::color(id(rc_rete_i), c);
          bool val = live && !mt;  // W/A/limit values, otherwise a status text
          ui::hidden(id(rc_rete_w), !val); ui::hidden(id(rc_rete_a), !val);
          ui::hidden(id(rc_rete_l), !val); ui::hidden(id(rc_rete_s), val);
          ui::text(id(rc_rete_w), ui::fmt(w, 0, " W ·"));
          ui::text(id(rc_rete_a), ui::fmt(a, 1));
          ui::text(id(rc_rete_l), "/ " + ui::fmt(lim, 0, " A"));
          ui::text(id(rc_rete_s), mt ? "magnetotermico giù" : "non collegata");
          if (mt) ui::color(id(rc_rete_s), ui::RED); else ui::theme_color(id(rc_rete_s));
          if (hot) ui::color(id(rc_rete_a), ui::AMBER); else ui::theme_color(id(rc_rete_a));
          lv_bar_set_value(id(rc_rete_bar), live && !mt ? (int) std::fmin(100.0f, a / lim * 100.0f) : 0, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(rc_rete_bar), lv_color_hex(hot ? ui::AMBER : ui::GREEN), LV_PART_INDICATOR);
          int sel = (int) std::lround(lim);
          ui::checked(id(lim_4), sel == 4); ui::checked(id(lim_6), sel == 6);
          ui::checked(id(lim_10), sel == 10); ui::checked(id(lim_16), sel == 16);
      - script.execute: update_alarms

  - id: update_alarms
    then:
      - lambda: |-
          auto on = [](const std::string &s) { return s == "on"; };
          std::vector<std::string> al;  // active alarms, in order of severity
          if (on(id(ha_gas_alarm).state)) al.push_back("Allarme gas in cucina: arieggia e chiudi la bombola");
          if (on(id(ha_motore).state) && on(id(ha_porta).state)) al.push_back("Motore acceso con la porta della cellula aperta");
          {
            auto th = [](float v, float def) { return isnan(v) ? def : v; };
            float mna = th(id(ha_tpms_min_ant).state, 4.3f), mnp = th(id(ha_tpms_min_post).state, 4.7f);
            float mxa = th(id(ha_tpms_max_ant).state, 6.0f), mxp = th(id(ha_tpms_max_post).state, 6.6f);
            struct T { float p, t, mn, mx; const char *n; } ts[] = {
              {id(ha_p_as).state, id(ha_tt_as).state, mna, mxa, "anteriore sinistra"},
              {id(ha_p_ad).state, id(ha_tt_ad).state, mna, mxa, "anteriore destra"},
              {id(ha_p_ps).state, id(ha_tt_ps).state, mnp, mxp, "posteriore sinistra"},
              {id(ha_p_pd).state, id(ha_tt_pd).state, mnp, mxp, "posteriore destra"}};
            for (auto &t : ts) {
              if (!isnan(t.p) && (t.p < t.mn || t.p > t.mx)) { al.push_back(std::string("Gomma ") + t.n + ": " + ui::fmt(t.p, 1, " bar")); break; }
              if (!isnan(t.t) && t.t > 75) { al.push_back(std::string("Gomma ") + t.n + " calda: " + ui::fmt(t.t, 0, "°")); break; }
            }
          }
          if (on(id(ha_rete_mt).state)) al.push_back("Magnetotermico 230V scattato: camper senza rete");
          // fixed text (without amperes): "Ok, seen" holds until text changes
          if (id(ha_rete_a).state > 0.9f * (isnan(id(ha_rete_lim).state) ? 10.0f : id(ha_rete_lim).state))
            al.push_back("Colonnina quasi al limite: spegni qualcosa");
          if (id(ha_batt_soc).state < 30) al.push_back("Batteria servizi sotto il 30%");
          if (id(ha_water).state < 10) al.push_back("Acqua quasi finita");
          if (id(ha_gas_percent).state < 10) al.push_back("Bombola del gas quasi vuota");
          // dashboard indicator (only with key inserted); with key removed the threshold remains: the light turns on at ~11 L = 12%
          if (id(ha_fuel_low).state || id(ha_fuel).state < 13) al.push_back("Riserva gasolio");
          if (id(ha_coolant).state > 105) al.push_back("Motore caldo: liquido oltre 105°");
          // "Ok, visto" applies per alarm; once the alarm is gone, it is forgotten
          std::string seen = "|", cur;
          std::vector<std::string> vis;
          for (auto &x : al) {
            if (id(alarm_seen).find("|" + x + "|") != std::string::npos) seen += x + "|";
            else vis.push_back(x);
          }
          id(alarm_seen) = seen == "|" ? "" : seen;
          // several unseen alarms: they rotate (alarm_rotate script, every 5 s)
          if (!vis.empty()) cur = vis[id(alarm_idx) % vis.size()];
          id(alarm_text) = cur;
          std::string a = al.empty() ? std::string() : (cur.empty() ? al[0] : cur);
          bool show = !cur.empty();
          if (vis.size() > 1) cur += "  (" + std::to_string(id(alarm_idx) % vis.size() + 1) + "/" + std::to_string(vis.size()) + ")";
          ui::hidden(id(banner), !show);
          ui::hidden(id(chip_porta), show);
          ui::hidden(id(chip_gas), show);
          ui::hidden(id(chip_stato), show);
          ui::text(id(banner_l), cur);
          std::string lst;
          for (auto &x : al) {
            bool sn = id(alarm_seen).find("|" + x + "|") != std::string::npos;
            lst += (lst.empty() ? "" : "\n\n") + std::string("• ") + x + (sn ? "  (visto)" : "");
          }
          ui::text(id(al_list), lst.empty() ? std::string("Nessun allarme") : lst);
          ui::text(id(chip_stato_i), a.empty() ? "\U000F0CC8" : "\U000F0028");
          ui::color(id(chip_stato_i), a.empty() ? ui::GREEN : ui::AMBER);
          ui::text(id(chip_stato_l), a.empty() ? "Nessun allarme" : "Allarme visto");
          ui::text(id(nt_state), a.empty() ? std::string("tutto ok") : a);
          ui::text(id(nt_state_i), a.empty() ? "\U000F0CC8" : "\U000F0028");

  # Banner rotation when more than one is unseen
  - id: alarm_rotate
    then:
      - lambda: 'id(alarm_idx)++;'
      - script.execute: update_alarms

  # ── "Partenza" (departure) checklist ──
  - id: update_checklist
    then:
      - lambda: |-
          // 1 ok, 0 to fix, -1 missing data
          auto st = [](const std::string &s, const char *good, const char *bad) {
            return s == good ? 1 : (s == bad ? 0 : -1);
          };
          const std::string &fs = id(ha_frigo_state).state;
          int frigo = (fs.empty() || fs == "unavailable" || fs == "unknown") ? -1 : (fs != "off" ? 1 : 0);
          int res[] = {st(id(ha_porta).state, "off", "on"), st(id(ha_porte_cab).state, "off", "on"),
                       st(id(ha_pompa).state, "off", "on"), st(id(ha_l_esterna).state, "off", "on"),
                       st(id(ha_clima_state).state, "off", "cool"), st(id(ha_gas_alarm).state, "off", "on"), frigo};
          lv_obj_t *ico[] = {id(chk_0_i), id(chk_1_i), id(chk_2_i), id(chk_3_i), id(chk_4_i), id(chk_5_i), id(chk_6_i)};
          for (int i = 0; i < 7; i++) {
            ui::text(ico[i], res[i] == 1 ? "\U000F05E0" : (res[i] == 0 ? "\U000F0159" : "\U000F0028"));
            ui::color(ico[i], res[i] == 1 ? ui::GREEN : (res[i] == 0 ? ui::RED : ui::GREY));
          }

  # ── Vehicle and warning lights ──
  - id: update_vehicle
    then:
      - lambda: |-
          bool mot = id(ha_motore).state == "on";
          float fuel = id(ha_fuel).state, km = id(ha_fuel_km).state, oil = id(ha_oil).state;
          float cool = id(ha_coolant).state, v1 = id(ha_batt_v1).state;
          ui::text(id(vs_ico), mot ? "\U000F01FA" : "\U000F0A47");
          ui::color(id(vs_ico), mot ? ui::GREEN : ui::GREY);
          ui::text(id(vs_state), mot ? "Motore acceso" : "Fermo");
          ui::text(id(vs_sub), mot ? "in marcia o al minimo" : "motore spento");
          ui::text(id(vs_fuel), ui::fmt(fuel, 0, "%"));
          lv_bar_set_value(id(vs_fuel_bar), isnan(fuel) ? 0 : (int) lroundf(fuel), LV_ANIM_OFF);
          ui::text(id(vs_fuel_km), isnan(km) ? std::string("") : "~" + ui::fmt(km, 0, " km"));
          ui::text(id(vs_oil), ui::fmt(oil, 0, "°"));
          ui::text(id(vs_cool), ui::fmt(cool, 0, "°"));
          auto spy = [](lv_obj_t *i, lv_obj_t *l, const std::string &t, uint32_t c) { ui::text(l, t); ui::color(i, c); };
          const std::string &fr = id(ha_freno).state, &po = id(ha_porte_cab).state, &lu = id(ha_anabb).state;
          spy(id(sp_freno_i), id(sp_freno), fr == "on" ? "Freno tirato" : (fr == "off" ? "Freno libero" : "Freno a mano"),
              fr == "on" ? ui::GREEN : (fr == "off" ? (mot ? ui::GREY : ui::AMBER) : ui::GREY));
          spy(id(sp_porte_i), id(sp_porte), po == "on" ? "Porte aperte" : (po == "off" ? "Porte chiuse" : "Porte cabina"),
              po == "on" ? ui::RED : (po == "off" ? ui::GREEN : ui::GREY));
          spy(id(sp_luci_i), id(sp_luci), lu == "on" ? "Fari accesi" : (lu == "off" ? "Fari spenti" : "Luci"),
              lu == "on" ? (mot ? ui::GREEN : ui::AMBER) : (lu == "off" ? ui::GREEN : ui::GREY));
          spy(id(sp_olio_i), id(sp_olio), isnan(oil) ? std::string("Olio") : "Olio " + ui::fmt(oil, 0, "°"),
              isnan(oil) ? ui::GREY : (oil > 120 ? ui::RED : ui::GREEN));
          spy(id(sp_batt_i), id(sp_batt), isnan(v1) ? std::string("Batteria") : "Avv. " + ui::fmt(v1, 1, " V"),
              isnan(v1) ? ui::GREY : (v1 < 11.5f ? ui::RED : (v1 < 12.1f ? ui::AMBER : ui::GREEN)));
          spy(id(sp_liq_i), id(sp_liq), isnan(cool) ? std::string("Liquido") : "Liquido " + ui::fmt(cool, 0, "°"),
              isnan(cool) ? ui::GREY : (cool > 105 ? ui::RED : ui::GREEN));
      - script.execute: update_alarms
      - script.execute: update_checklist

  # ── Tyres ──
  - id: update_tyres
    then:
      - lambda: |-
          auto th = [](float v, float def) { return isnan(v) ? def : v; };
          float mna = th(id(ha_tpms_min_ant).state, 4.3f), mnp = th(id(ha_tpms_min_post).state, 4.7f);
          float mxa = th(id(ha_tpms_max_ant).state, 6.0f), mxp = th(id(ha_tpms_max_post).state, 6.6f);
          int bad = 0, missing = 0;
          auto show = [&](lv_obj_t *lp, lv_obj_t *lt, float p, float t, float mn, float mx) {
            bool b = !isnan(p) && (p < mn || p > mx || (!isnan(t) && t > 75));
            if (isnan(p)) missing++;
            if (b) bad++;
            ui::text(lp, ui::fmt(p, 1, " bar"));
            ui::color(lp, isnan(p) ? ui::GREY : (b ? ui::RED : ui::GREEN));
            ui::text(lt, isnan(t) ? std::string("") : ui::fmt(t, 0, "°"));
          };
          show(id(ty_as), id(ty_as_t), id(ha_p_as).state, id(ha_tt_as).state, mna, mxa);
          show(id(ty_ad), id(ty_ad_t), id(ha_p_ad).state, id(ha_tt_ad).state, mna, mxa);
          show(id(ty_ps), id(ty_ps_t), id(ha_p_ps).state, id(ha_tt_ps).state, mnp, mxp);
          show(id(ty_pd), id(ty_pd_t), id(ha_p_pd).state, id(ha_tt_pd).state, mnp, mxp);
          ui::text(id(ty_head), bad ? "controlla" : (missing ? "dati mancanti" : "tutte ok"));
          uint32_t c = bad ? ui::RED : (missing ? ui::GREY : ui::GREEN);
          ui::color(id(ty_head), c);
          ui::color(id(ty_head_i), c);
      - script.execute: update_alarms

  # ── Level ──
  - id: update_level
    then:
      - lambda: |-
          float x = id(ha_tilt_x).state, y = id(ha_tilt_y).state;
          if (isnan(x) || isnan(y)) {
            lv_obj_set_pos(id(lv_dot), 98, 98);
            lv_obj_set_style_bg_color(id(lv_dot), lv_color_hex(ui::GREY), 0);
            ui::text(id(lv_state), "--");
            ui::text(id(lv_xy), "");
            return;
          }
          auto cl = [](float v) { return std::fmax(-1.0f, std::fmin(1.0f, v / 3.0f)); };
          lv_obj_set_pos(id(lv_dot), 98 + (int) lroundf(cl(x) * 98), 98 + (int) lroundf(cl(y) * 98));
          const std::string &s = id(ha_livella).state;
          float m = std::fmax(fabsf(x), fabsf(y));
          bool in = s == "in_bolla" || (s != "fuori_bolla" && m <= 0.5f);
          lv_obj_set_style_bg_color(id(lv_dot), lv_color_hex(in ? ui::GREEN : (m < 1.5f ? ui::AMBER : ui::RED)), 0);
          ui::text(id(lv_state), in ? "In bolla" : (m < 1.5f ? "Quasi in bolla" : "Fuori bolla"));
          ui::text(id(lv_xy), "X " + ui::fmt(x, 1, "°") + " · Y " + ui::fmt(y, 1, "°"));

  # ── Brightness ──
  - id: update_brightness
    then:
      # Apply ONLY if the display is already on: the HA automation that sets
      # the brightness must not wake the screen from standby.
      - if:
          condition:
            lambda: 'return id(display_backlight).current_values.is_on() && !id(night_on);'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(display_brightness) / 100.0;'
      - lvgl.slider.update: { id: slider_brightness, value: !lambda 'return id(display_brightness);' }
      - lvgl.slider.update: { id: sys_bright, value: !lambda 'return id(display_brightness);' }
      - lambda: |-
          std::string p = std::to_string(id(display_brightness)) + "%";
          ui::text(id(brightness_pct), p);
          ui::text(id(sys_bright_v), p);

  - id: toggle_brightness_panel
    mode: restart
    then:
      - lvgl.widget.update: { id: brightness_panel, hidden: false }
      - lvgl.slider.update: { id: slider_brightness, value: !lambda 'return id(display_brightness);' }
      - delay: 5s
      - lvgl.widget.update: { id: brightness_panel, hidden: true }

  # ── 12V loads (status in System) ──
  # NB: not hooked to the switch's on_turn_on/off — that fires
  # during setup (restore_mode) when LVGL does not exist yet and the P4
  # crashes. Called by on_boot, pin_check and the 5s interval.
  - id: update_utenze
    then:
      - lambda: |-
          bool on = id(sw_utenze).state;
          bool run = id(spegni_server).is_running() && id(ut_left) > 0;
          // popup: large countdown, then "off" alert with Turn on/Close
          ui::hidden(id(ut_catch), on || run);
          ui::hidden(id(utp_num), !run);
          ui::hidden(id(utp_secs), !run);
          ui::hidden(id(utp_on), run);
          ui::hidden(id(utp_close), run);
          if (on && !run) ui::hidden(id(ut_pop), true);
          if (run) {
            ui::hidden(id(ut_pop), false);
            ui::text(id(utp_title), "Spegnimento in corso");
            ui::text(id(utp_sub), "Server e router si spengono, poi si staccano le utenze 12V");
            ui::text(id(utp_num), std::to_string(id(ut_left)));
            ui::text(id(sys_ut_v), "Spegnimento server...");
            ui::color(id(sys_ut_v), ui::ACCENT);
            char b[24]; snprintf(b, sizeof(b), "Stacco tra %d s", id(ut_left));
            ui::text(id(sys_ut_btn_l), b);
            return;
          }
          ui::text(id(utp_title), "Utenze 12V spente");
          ui::text(id(utp_sub), "Luci, pompa, prese 12V e Home Assistant sono senza corrente");
          ui::text(id(sys_ut_v), on ? "Accese" : "Spente");
          ui::color(id(sys_ut_v), on ? ui::GREEN : ui::ACCENT);
          ui::text(id(sys_ut_btn_l), on ? "Spegni server e utenze" : "Accendi le utenze");

  # The HAOS Raspberry and the GL.iNet are on the loads line: they shut down first
  # (HA script camper_spegni_server), then the main switch is cut. The panel
  # counts down on its own: HA goes away during shutdown. If the API is not
  # connected the call is lost and the cut-off happens anyway.
  # ponytail: no cancel during the 90 s, add it if needed.
  - id: spegni_server
    mode: single
    then:
      - homeassistant.service:
          service: script.turn_on
          data: { entity_id: script.camper_spegni_server }
      - lambda: 'id(ut_left) = 90;'
      - repeat:
          count: 90
          then:
            - script.execute: update_utenze
            - delay: 1s
            - lambda: 'id(ut_left)--;'
      - switch.turn_off: sw_utenze
      # the script is still "running" here: ut_left = 0 closes the countdown
      - lambda: 'id(ut_left) = 0;'
      - script.execute: update_utenze
      - lvgl.widget.update: { id: ut_pop, hidden: false }

  # ────────────────────────────────────────────────────────────
  # PIN keypad for the main loads switch
  # The PIN is required in BOTH directions: an accidental slap on the touch must
  # neither turn the camper off nor back on.
  # ────────────────────────────────────────────────────────────
  - id: pin_open
    then:
      - lambda: 'id(pin_target) = !id(sw_utenze).state;'
      - lvgl.label.update:
          id: pin_title
          text: !lambda |-
            return id(pin_target) ? std::string("Accendere le utenze 12V?")
                                  : std::string("Spegnere le utenze 12V?");
      - script.execute: pin_clear
      - lvgl.widget.update: { id: pin_panel, hidden: false }

  - id: pin_clear
    then:
      - lambda: |-
          id(pin_buf) = "";
          ui::text(id(pin_dots), "");
          ui::text(id(pin_msg), "Inserisci il PIN");
          ui::theme_color(id(pin_msg));

  - id: pin_key
    parameters:
      d: string
    then:
      - lambda: |-
          if (id(pin_buf).size() < 6) id(pin_buf) += d;
          ui::text(id(pin_dots), std::string(id(pin_buf).size(), '*'));
      # 6 digits = automatic check, the OK key stays for convenience
      - if:
          condition:
            lambda: 'return id(pin_buf).size() >= 6;'
          then:
            - script.execute: pin_check

  - id: pin_check
    then:
      - if:
          condition:
            lambda: 'return id(pin_buf) == "${utenze_pin}";'
          then:
            - lvgl.widget.update: { id: pin_panel, hidden: true }
            - lambda: 'id(pin_buf) = "";'
            - if:
                condition:
                  lambda: 'return id(pin_target);'
                then:
                  - switch.turn_on: sw_utenze
                else:
                  - script.execute: spegni_server
            - script.execute: update_utenze
          else:
            - lambda: |-
                id(pin_buf) = "";
                ui::text(id(pin_dots), "");
                ui::text(id(pin_msg), "PIN errato");
                ui::color(id(pin_msg), ui::RED);

  - id: pin_close
    then:
      - lambda: 'id(pin_buf) = "";'
      - lvgl.widget.update: { id: pin_panel, hidden: true }

# ────────────────────────────────────────────────────────────
# Audio REMOVED 2026-07-05: the board only has the speaker interface
# (connector 11), no speaker connected. When a speaker is added,
# restore from git (commit a8defef: es8311 + i2s + speaker +
# rtttl/buzzer + media_player for TTS; amp enable GPIO11).
# ────────────────────────────────────────────────────────────

binary_sensor:
  # Grey tank full probe: wet = voltage below ~1.6 V. Long delays against
  # sloshing while driving.
  - platform: template
    id: grey_full
    name: "Grigie piene"
    lambda: 'return id(grey_full_v).state < 1.6f;'
    filters: [delayed_on: 60s, delayed_off: 60s]
    on_press:
      - lambda: 'id(grey_est_l) = ${grey_l}; id(update_grey).execute();'
    on_release:
      # The full probe only goes dry when draining (the tank is always fully emptied)
      - lambda: 'id(grey_est_l) = 0; id(update_grey).execute();'
  - platform: homeassistant
    id: ha_fuel_low
    entity_id: binary_sensor.wican_riserva_carburante
    on_state: { script.execute: update_alarms }
  - platform: homeassistant
    id: ha_presence
    entity_id: binary_sensor.sensore_presenza_dinette_presence
    on_press: { script.execute: presence_wake }
    on_release:
      - if:
          condition:
            lambda: 'return id(night_on);'
          then:
            - script.execute: saver_timeout
  # Heater status from the dedicated Webasto ESP32 (separate project), via HA.
  # Until the entity exists the card shows "--".
  - platform: homeassistant
    id: webasto_running
    entity_id: binary_sensor.webasto_in_funzione
    on_state:
      - lvgl.label.update:
          id: lbl_webasto
          text: !lambda 'return std::string(x ? "In funzione" : "Spenta");'
      - lambda: |-
          ui::text(id(st_web_v), x ? "In funzione" : "Spenta");
          if (x) ui::color(id(st_web_v), ui::GREEN); else ui::theme_color(id(st_web_v));

interval:
  - interval: 1s
    then:
      - script.execute: update_clock

  - interval: 6s
    then:
      - script.execute: alarm_rotate

  # Resync light buttons, alarms and loads (fallback if an event is lost)
  - interval: 5s
    then:
      - lambda: |-
          struct L { lv_obj_t *b; esphome::homeassistant::HomeassistantTextSensor *s; } ls[] = {
            {id(lt_princ), id(ha_l_princ)}, {id(lt_tavolo), id(ha_l_tavolo)}, {id(lt_panca), id(ha_l_panca)},
            {id(lt_leddin), id(ha_l_leddin)}, {id(lt_corr), id(ha_l_corr)}, {id(lt_cucina), id(ha_l_cucina)},
            {id(lt_ledcuc), id(ha_l_ledcuc)}, {id(lt_bagno), id(ha_l_bagno)}, {id(lt_doccia), id(ha_l_doccia)},
            {id(lt_gavone), id(ha_l_gavone)}, {id(lt_esterna), id(ha_l_esterna)}, {id(lt_mans1), id(ha_l_mans1)},
            {id(lt_mans2), id(ha_l_mans2)}, {id(lt_letto1), id(ha_l_letto1)}, {id(lt_letto2), id(ha_l_letto2)}};
          for (auto &l : ls) ui::checked(l.b, l.s->state == "on");
          ui::text(id(sys_ip), id(wifi_ip).state.empty() ? std::string("--") : id(wifi_ip).state);
      - script.execute: update_lights
      - script.execute: update_alarms
      - script.execute: update_utenze

  # Hourly resource history + estimates (writes to flash once an hour)
  - interval: 60s
    then:
      - script.execute: history_tick
      - lambda: |-
          if (id(dom_on) && id(dom_warm_since) && millis() - id(dom_warm_since) >= 30UL * 60 * 1000) {
            id(dom_on) = false; id(dom_warm_since) = 0;
          }
          ui::checked(id(fr_dom), id(dom_on));
